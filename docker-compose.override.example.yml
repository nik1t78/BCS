# Пример дополнительного ограничения ресурсов. Скопируйте в docker-compose.override.yml
# и подгоните под свой сервер (docker compose автоматически подхватит этот файл).
# Суммарный лимит всей платформы BCS ≈ 2.4 ГБ RAM вместо потребления "сколько попросит".
services:
  mysql:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"
        reservations:
          memory: 128M
  redis:
    deploy:
      resources:
        limits:
          memory: 160M
          cpus: "0.25"
  backend:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"
  queue:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
  scheduler:
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.25"
  nginx:
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.25"
  vks-bot:
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
