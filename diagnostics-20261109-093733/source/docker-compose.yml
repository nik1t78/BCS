# =============================================================================
# BCS вЂ” РїРѕР»РЅС‹Р№ СЃС‚РµРє: С„СЂРѕРЅС‚ (React/Vite), Р±СЌРєРµРЅРґ (Laravel 12 php-fpm), nginx,
# MySQL, Redis. Р¤Р°Р№Р» РЅР°РјРµСЂРµРЅРЅРѕ РјРёРЅРёРјР°Р»СЊРЅС‹Р№: РЅРёРєР°РєРѕР№ В«СЃР°РјРѕР»РµС‡Р°С‰РµР№В» Р»РѕРіРёРєРё,
# С‚РѕР»СЊРєРѕ СЂР°Р·РІРѕСЂР°С‡РёРІР°РЅРёРµ РіРѕС‚РѕРІС‹С… РѕР±СЂР°Р·РѕРІ. Р’СЃРµ РѕР±СЂР°Р·С‹ СЃРѕР±РёСЂР°СЋС‚СЃСЏ Р»РѕРєР°Р»СЊРЅРѕ РёР·
# Dockerfile РІ СЌС‚РѕРј Р¶Рµ СЂРµРїРѕР·РёС‚РѕСЂРёРё (РёР»Рё Р±РµСЂСѓС‚СЃСЏ СЃ Docker Hub РєР°Рє РµСЃС‚СЊ).
#
# Р—Р°РїСѓСЃРє:                docker compose up -d --build
# РЎС‚Р°С‚РёРєР° Laravel:       docker compose run --rm backend-assets   (РїРѕСЃР»Рµ СЃР±РѕСЂРєРё backend)
# РљР»СЋС‡ РїСЂРёР»РѕР¶РµРЅРёСЏ:       docker compose exec backend php artisan key:generate --show
# =============================================================================

x-defaults: &container-defaults
  deploy:
    resources:
      limits:
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

# РћР±С‰Р°СЏ СЃР±РѕСЂРєР° backend-РѕР±СЂР°Р·Р° (РёСЃРїРѕР»СЊР·СѓРµС‚СЃСЏ СЃРµСЂРІРёСЃР°РјРё РЅРёР¶Рµ С‡РµСЂРµР· YAML-СЏРєРѕСЂСЊ)
x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime

# РћР±С‰РёРµ runtime-С‚РѕРјР° Р±СЌРєРµРЅРґР° (РєРѕРґ Рё vendor вЂ” РІРЅСѓС‚СЂРё РѕР±СЂР°Р·Р°, РЅРµ РІ bind-mount)
x-backend-volumes: &backend-volumes
  - type: volume
    source: backend_storage
    target: /var/www/html/storage
  - type: volume
    source: db_backups
    target: /var/www/html/storage/app/backups
  - type: volume
    source: backend_bootstrap_cache
    target: /var/www/html/bootstrap/cache

# РћР±С‰РёРµ РїРµСЂРµРјРµРЅРЅС‹Рµ РѕРєСЂСѓР¶РµРЅРёСЏ php-СЃРµСЂРІРёСЃРѕРІ
x-backend-env: &backend-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
  DB_USERNAME: "${DB_USERNAME:-vks_user}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}"
  APP_URL: "http://${SITE_IP:-localhost}"
  # APP_KEY РћР‘РЇР—РђРўР•Р›Р•Рќ: SESSION_DRIVER=cookie, РїРѕСЌС‚РѕРјСѓ РїСЂРё РїСѓСЃС‚РѕРј/Р±РёС‚РѕРј РєР»СЋС‡Рµ
  # Р»СЋР±РѕР№ Р·Р°РїСЂРѕСЃ Рє /api/* РїР°РґР°РµС‚ СЃ HTTP 500 ("Unsupported cipher or incorrect key length").
  # РљР»СЋС‡ РґРѕР»Р¶РµРЅ РЅР°С‡РёРЅР°С‚СЊСЃСЏ СЃ "base64:" Рё Р±С‹С‚СЊ 32 Р±Р°Р№С‚Р° РІ base64. РЎРіРµРЅРµСЂРёСЂСѓР№С‚Рµ:
  #   docker compose run --rm backend php artisan key:generate --show
  # Рё Р·Р°РїРёС€РёС‚Рµ СЂРµР·СѓР»СЊС‚Р°С‚ РІ .env:  APP_KEY=base64:....
  APP_KEY: "${APP_KEY:?APP_KEY РЅРµ Р·Р°РґР°РЅ! Р”РѕР±Р°РІСЊС‚Рµ РІ .env СЃС‚СЂРѕРєСѓ APP_KEY=base64:... (СЃРј. docker compose run --rm backend php artisan key:generate --show)}"
  APP_ENV: "${APP_ENV:-production}"
  APP_DEBUG: "false"
  # Р•РґРёРЅР°СЏ С‚Р°Р№РјР·РѕРЅР° РїСЂРёР»РѕР¶РµРЅРёСЏ (СЃРѕРІРїР°РґР°РµС‚ СЃ TZ РєРѕРЅС‚РµР№РЅРµСЂРѕРІ php-fpm/РѕС‡РµСЂРµРґРµР№).
  # Р‘РµР· РЅРµС‘ Carbon СЃС‡РёС‚Р°Р» wall-clock-РІСЂРµРјСЏ РєР°Рє UTC в†’ В«РІСЂРµРјСЏ РЅРµ СЃРѕРІРїР°РґР°РµС‚В» РЅР° 3 С‡Р°СЃР°.
  APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Moscow}"
  # РЇРІРЅРѕ РїСЂРѕР±СЂР°СЃС‹РІР°РµРј TZ РІРѕ Р’РЎР• php-РєРѕРЅС‚РµР№РЅРµСЂС‹ (backend/queue/scheduler),
  # С‡С‚РѕР±С‹ date()/cron-СЂР°СЃРїРёСЃР°РЅРёСЏ Р¶РёР»Рё РІ РѕРґРЅРѕРј С‡Р°СЃРѕРІРѕРј РїРѕСЏСЃРµ.
  TZ: "${TZ:-Europe/Moscow}"
  SESSION_DRIVER: cookie
  # РќР°РґС‘Р¶РЅС‹Р№ file cache Рё database queue: Redis РѕСЃС‚Р°С‘С‚СЃСЏ РЅРµРѕР±СЏР·Р°С‚РµР»СЊРЅС‹Рј.
  CACHE_STORE: "file"
  QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
  DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-300}"
  # Р¤Р»Р°РіРё Р°РІС‚РѕРїРёР»РѕС‚Р° Р’РљРЎ-СЃСЃС‹Р»РѕРє (СЃРј. php artisan vks:autopilot):
  VKSBOT_EXPECTED: "${VKSBOT_EXPECTED:-false}"
  VKSBOT_AUTO: "${VKSBOT_AUTO:-true}"
  VKSBOT_CHECK_MINUTES: "${VKSBOT_CHECK_MINUTES:-60}"
  BOT_TOKENS: "${BOT_TOKENS:-}"
  MESSENGER: "${MESSENGER:-max}"
  MAX_ENABLED: "${MAX_ENABLED:-true}"
  MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
  MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
  MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"

services:
  # Frontend (React + Vite): РѕРґРЅРѕСЂР°Р·РѕРІС‹Р№ СЃР±РѕСЂС‰РёРє -> volume frontend_build
  frontend:
    <<: *container-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # BUILD_ID РјРѕР¶РЅРѕ РёР·РјРµРЅРёС‚СЊ РІСЂСѓС‡РЅСѓСЋ РґР»СЏ РїСЂРёРЅСѓРґРёС‚РµР»СЊРЅРѕР№ РёРЅРІР°Р»РёРґР°С†РёРё СЃР»РѕСЏ.
        # РћР±С‹С‡РЅС‹Р№ watchdog РґРµР»Р°РµС‚ `compose up -d` Р‘Р•Р— СЃР±РѕСЂРєРё вЂ” СЌС‚Рѕ РЅРµ РґРѕР»Р¶РЅРѕ
        # РЅР°РіСЂСѓР¶Р°С‚СЊ CPU РєР°Р¶РґС‹Рµ 5 РјРёРЅСѓС‚. РџСЂРё СЂРµР»РёР·Рµ РёСЃРїРѕР»СЊР·СѓР№С‚Рµ `up -d --build`.
        BUILD_ID: "${BUILD_ID:-stable}"
    container_name: vks-frontend-builder
    restart: "no"
    networks: [vks-network]
    # РћР±СЂР°Р· РїРµСЂРµСЃРѕР±РёСЂР°РµС‚СЃСЏ С‚РѕР»СЊРєРѕ РїСЂРё СѓСЃС‚Р°РЅРѕРІРєРµ/СЂРµР»РёР·Рµ С‡РµСЂРµР· `--build`.
    # Watchdog Р·Р°РїСѓСЃРєР°РµС‚ `compose up -d` Р±РµР· СЃР±РѕСЂРєРё, С‡С‚РѕР±С‹ РЅРµ РЅР°РіСЂСѓР¶Р°С‚СЊ CPU.
    volumes:
      - type: volume
        source: frontend_build
        target: /mnt/dist

  # Backend (php-fpm)
  backend:
    <<: *container-defaults
    build: *backend-build
    container_name: vks-backend
    restart: unless-stopped
    volumes: *backend-volumes
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    networks: [vks-network]

  # Nginx: С‚РѕС‡РєР° РІС…РѕРґР° (РїРѕСЂС‚ 80), СЂР°Р·РґР°С‘С‚ С„СЂРѕРЅС‚ + static Laravel, С„Р°СЃС‚-cgi РЅР° backend
  nginx:
    <<: *container-defaults
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      - "${LISTEN_IP:-0.0.0.0}:80:80"
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: frontend_build
        target: /var/www/frontend
        read_only: true
      - type: volume
        source: backend_public
        target: /var/www/backend/public
        read_only: true
      - type: volume
        source: backend_storage
        target: /var/www/backend-storage
        read_only: true
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    networks: [vks-network]

  # РћРґРЅРѕСЂР°Р·РѕРІС‹Р№ СЌРєСЃРїРѕСЂС‚С‘СЂ public/ РёР· РѕР±СЂР°Р·Р° backend РІ volume backend_public.
  # Р—Р°РїСѓСЃРєР°С‚СЊ РїРѕСЃР»Рµ РєР°Р¶РґРѕР№ РїРµСЂРµСЃР±РѕСЂРєРё backend-РѕР±СЂР°Р·Р°:
  #   docker compose run --rm backend-assets
  backend-assets:
    profiles: ["tools"]
    build: *backend-build
    container_name: vks-backend-assets
    restart: "no"
    command: sh -c 'cp -a /var/www/html/public/. /mnt/public/ && echo ">>> backend public extracted"'
    volumes:
      - type: volume
        source: backend_public
        target: /mnt/public
    networks: [vks-network]

  # MySQL (РґР°РЅРЅС‹Рµ вЂ” РІ ./docker/mysql/data, РїРµСЂРµР¶РёРІР°СЋС‚ down/РїРµСЂРµСЃР±РѕСЂРєРё)
  mysql:
    <<: *container-defaults
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    shm_size: 64mb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}
      MYSQL_DATABASE: ${DB_DATABASE:-vks_schedule}
      MYSQL_USER: ${DB_USERNAME:-vks_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}
    volumes:
      - type: bind
        source: ./docker/mysql/data
        target: /var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --table-definition-cache=400
      - --table-open-cache=400
      - --max-connections=80
      - --tmp-table-size=8M
      - --max-heap-table-size=16M
      - --innodb-log-buffer-size=8M
      # Flush committed transactions to durable storage; safer after sudden power loss.
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --innodb-file-per-table=ON
      - --max-allowed-packet=64M
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [vks-network]

  # Redis (РєСЌС€/РѕС‡РµСЂРµРґРё/СЃРµСЃСЃРёРё; РґРѕСЃС‚СѓРї С‚РѕР»СЊРєРѕ РёР· РІРЅСѓС‚СЂРµРЅРЅРµР№ СЃРµС‚Рё)
  redis:
    <<: *container-defaults
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}"
    command: >-
      redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD РЅРµ Р·Р°РґР°РЅ! РЈРєР°Р¶РёС‚Рµ РґР»РёРЅРЅС‹Р№ СѓРЅРёРєР°Р»СЊРЅС‹Р№ РїР°СЂРѕР»СЊ РІ .env}
      --save "" --appendonly no --proto-max-bulk-len 1mb
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    networks: [vks-network]

  # Laravel Queue Worker
  queue:
    <<: *container-defaults
    build: *backend-build
    container_name: vks-queue
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    # queue:heartbeat РїРёС€РµС‚ timestamp РІ РѕР±С‰РёР№ volume storage РєР°Р¶РґС‹Рµ ~20 c вЂ”
    # РїРѕ РЅРµРјСѓ В«РЎС‚Р°С‚СѓСЃ СЃРёСЃС‚РµРјС‹В»/system:monitor С‡РµСЃС‚РЅРѕ РІРёРґСЏС‚, Р¶РёРІ Р»Рё РІРѕСЂРєРµСЂ
    # (СѓРїР°Р» queue:work РёР»Рё РІРµСЃСЊ РєРѕРЅС‚РµР№РЅРµСЂ вЂ” С„Р°Р№Р» РїРµСЂРµСЃС‚Р°С‘С‚ РѕР±РЅРѕРІР»СЏС‚СЊСЃСЏ).
    command: sh -c 'php artisan migrate --force || true; php artisan queue:heartbeat >/dev/null 2>&1 & i=0; while [ "$$i" -lt "$${QUEUE_WORKERS:-2}" ]; do (while true; do php artisan queue:work database --queue=vks,default --sleep=1 --tries=3 --timeout=240 --max-time=3600; sleep 1; done) & i=$$((i+1)); done; wait'
    volumes: *backend-volumes
    environment:
      <<: *backend-env
      QUEUE_WORKERS: "$${QUEUE_WORKERS:-2}"
      BCS_RUN_AS_WWW_DATA: "1"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[q]ueue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s
    init: true
    networks: [vks-network]

  # Laravel Scheduler
  scheduler:
    <<: *container-defaults
    build: *backend-build
    container_name: vks-scheduler
    restart: unless-stopped
    command: sh -c 'php artisan migrate --force || true; while true; do php artisan schedule:run --no-interaction & sleep 60; done'
    volumes: *backend-volumes
    environment:
      <<: *backend-env
      BCS_RUN_AS_WWW_DATA: "1"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[s]chedule:run' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    init: true
    networks: [vks-network]

  # РћРїС†РёРѕРЅР°Р»СЊРЅС‹Р№ Selenium-Р±РѕС‚ Р’РљРЎ (РїРѕ СѓРјРѕР»С‡Р°РЅРёСЋ РќР• Р·Р°РїСѓСЃРєР°РµС‚СЃСЏ):
  #   docker compose --profile bot up -d vks-bot
  vks-bot:
    profiles: ["bot"]
    build:
      context: ./vks-bot
      dockerfile: Dockerfile
    container_name: vks-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
    shm_size: 512mb
    init: true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BOT_HEADLESS: "1"
      BOT_PORT: "8090"
      BOT_TOKENS: "${BOT_TOKENS:-}"
      VKSBOT_CONCURRENCY: "${VKSBOT_CONCURRENCY:-2}"
      VKSBOT_QUEUE_LIMIT: "${VKSBOT_QUEUE_LIMIT:-20}"
      VKSBOT_ENGINE: "${VKSBOT_ENGINE:-playwright}"
      # РћРїС‚РёРјРёР·РёСЂРѕРІР°РЅРЅС‹Р№ Playwright: РїРѕРІС‚РѕСЂРЅРѕРµ РёСЃРїРѕР»СЊР·РѕРІР°РЅРёРµ Chromium,
      # РѕР¶РёРґР°РЅРёРµ DOM РІРјРµСЃС‚Рѕ РїРѕР»РЅРѕР№ Р·Р°РіСЂСѓР·РєРё РІСЃРµС… СЂРµСЃСѓСЂСЃРѕРІ.
      VKSBOT_TIMEOUT: "${VKSBOT_TIMEOUT:-90}"
      VKSBOT_GOTO_TIMEOUT_MS: "${VKSBOT_GOTO_TIMEOUT_MS:-45000}"
      VKSBOT_GOTO_ATTEMPTS: "${VKSBOT_GOTO_ATTEMPTS:-2}"
      TZ: "${TZ:-Europe/Moscow}"
    # Healthcheck: РјРѕРЅРёС‚РѕСЂРёРЅРі РґРѕСЃС‚СѓРїРЅРѕСЃС‚Рё Р±РѕС‚Р° (РёСЃРїРѕР»СЊР·СѓРµС‚СЃСЏ Рё bot:monitor,
    # Рё `docker compose ps` вЂ” СЃС‚Р°С‚СѓСЃ unhealthy РІРёРґРµРЅ СЃСЂР°Р·Сѓ).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4); sys.exit(0 if r.status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [vks-network]

networks:
