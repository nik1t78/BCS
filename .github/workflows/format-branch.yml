name: One-time Prettier cleanup (feature branch only)

on:
  push:
    branches:
      - vks/phase52-prettier-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/vks/phase52-prettier-cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format frontend source files
        run: npm run format

      - name: Verify formatting
        run: npm run format:check

      - name: Verify lint and types
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Verify production build
        run: npm run build

      - name: Commit formatting changes to this feature branch only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "style: format frontend source files"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
