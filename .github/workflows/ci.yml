name: CI

on:
  push:
    branches: [main, master, laravel, 'vks/**']
  pull_request:

jobs:
  frontend:
    name: Frontend (Vite + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier — existing repository debt)
        run: npm run format:check --if-present
        continue-on-error: true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # composer.json требует php ^8.4, а в lock-файле симфонийные пакеты
          # версии 8.x (нужен php >= 8.4.1). На 8.2 composer install падает.
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Verify composer.lock is in sync with composer.json
        # Лок-файл обязателен: без него docker-build идёт на packagist за
        # «latest» и падает по таймауту сети (curl error 28).
        run: composer update --lock --no-install --no-scripts --no-interaction && php -r '$l=json_decode(file_get_contents("composer.lock"), true); echo "Composer lock hash: ", $l["content-hash"], PHP_EOL;' && composer check-platform-reqs && composer validate --no-check-publish --strict

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --ansi 2>/dev/null || true

      - name: Validate PHP syntax
        run: |
          find app routes database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Boot Laravel and verify calendar routes
        run: php artisan route:list --path=calendar-feed

      - name: Run tests
        shell: bash
        run: |
          if find tests -type f -name '*Test.php' -print -quit | grep -q .; then
            php artisan test --no-interaction
          else
            echo "No backend test files found; backend test step is explicitly skipped."
          fi

  bot:
    name: VKS bot (Python syntax and entrypoint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile bot modules
        run: python -m compileall -q vks-bot
      - name: Validate backend entrypoint
        run: sh -n backend/docker-entrypoint.sh
