name: CI

on:
  push:
    branches: [main, master, laravel, 'vks/**']
  pull_request:

jobs:
  frontend:
    name: Frontend (Vite + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (block high and critical advisories)
        run: npm audit --audit-level=low

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Frontend performance code-splitting smoke checks
        run: node scripts/frontend-performance-smoke.mjs

      - name: Meeting time 30-minute snapping regression checks
        run: node scripts/meeting-time-snap-smoke.mjs

      - name: Server timezone countdown regression checks
        run: node scripts/server-timezone-countdown-smoke.mjs

      - name: Frontend API error redaction smoke checks
        run: node scripts/api-error-redaction-smoke.mjs

      - name: Verify Docker frontend dependency policy
        run: node scripts/docker-build-policy-smoke.mjs

      - name: Verify Laravel writable storage bootstrap
        run: node scripts/docker-entrypoint-storage-smoke.mjs

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # composer.json требует php ^8.4, а в lock-файле симфонийные пакеты
          # версии 8.x (нужен php >= 8.4.1). На 8.2 composer install падает.
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Audit Composer dependencies (block any known advisory)
        run: composer audit --locked --no-interaction

      - name: Verify composer.lock is in sync with composer.json
        # Лок-файл обязателен: без него docker-build идёт на packagist за
        # «latest» и падает по таймауту сети (curl error 28).
        run: composer check-platform-reqs && composer validate --no-check-publish --strict

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --ansi 2>/dev/null || true

      - name: Validate PHP syntax
        run: |
          find app routes database -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Boot Laravel and verify calendar routes
        run: php artisan route:list --path=calendar-feed

      - name: Verify smart meeting slot suggestion route
        run: php artisan route:list --path=meetings/suggest-slots

      - name: Verify permanent meeting link route
        run: php artisan route:list --name=meetings.permanent-link

      - name: Run security hardening smoke tests
        run: php tests/security-hardening-smoke.php

      - name: Run API error redaction regression smoke tests
        run: php tests/api-error-redaction-smoke.php

      - name: Run calendar regression smoke tests
        run: php tests/calendar-smoke.php

      - name: Run notification access regression smoke tests
        run: php tests/notification-access-smoke.php

      - name: Run MAX Bot API contract smoke tests
        run: php tests/max-messenger-api-smoke.php

      - name: Run notification stream ticket regression smoke tests
        run: php tests/notification-stream-ticket-smoke.php

      - name: Run notification stream recovery regression smoke tests
        run: php tests/notification-stream-recovery-smoke.php

      - name: Run CSV formula injection regression smoke tests
        run: php tests/csv-cell-smoke.php

      - name: Run RSVP reminder policy regression smoke tests
        run: php tests/rsvp-reminder-policy-smoke.php

      - name: Run meeting slot suggestion policy smoke tests
        run: php tests/meeting-slot-suggestion-policy-smoke.php

      - name: Run meeting heatmap accuracy policy smoke tests
        run: php tests/meeting-heatmap-policy-smoke.php

      - name: Run TV screen privacy and recurrence smoke tests
        run: php tests/tv-screen-policy-smoke.php

      - name: Run meeting edit policy regression smoke tests
        run: php tests/meeting-edit-policy-smoke.php

      - name: Run room lifecycle regression smoke tests
        run: php tests/room-lifecycle-smoke.php

      - name: Run user administration policy regression smoke tests
        run: php tests/user-administration-policy-smoke.php

      - name: Run meeting reminder timing regression smoke tests
        run: php tests/meeting-reminder-policy-smoke.php

      - name: Run meeting polls policy smoke tests
        run: php tests/meeting-poll-policy-smoke.php

      - name: Run queue heartbeat policy regression smoke tests
        run: php tests/queue-heartbeat-policy-smoke.php

      - name: Run system monitoring and Redis health regression smoke tests
        run: php tests/system-monitor-smoke.php

      - name: Run failed job summary redaction smoke tests
        run: php tests/failed-job-policy-smoke.php

      - name: Run VKS autopilot backlog regression smoke tests
        run: php tests/vks-autopilot-policy-smoke.php

      - name: Run Laravel test suite
        shell: bash
        run: |
          if find tests -type f -name '*Test.php' -print -quit | grep -q .; then
            php artisan test --no-interaction
          else
            echo "No PHPUnit feature/unit tests are present yet; calendar smoke tests ran in the previous step."
          fi

  bot:
    name: VKS bot (Python syntax and entrypoint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Compile bot modules
        run: python -m compileall -q vks-bot
      - name: Validate backend entrypoint
        run: sh -n backend/docker-entrypoint.sh

  nginx:
    name: Nginx configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Nginx configuration
        run: docker run --rm -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t

      - name: Validate Docker Compose configuration
        env:
          DB_PASSWORD: ci-test-db-password
          DB_ROOT_PASSWORD: ci-test-root-password
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          REDIS_PASSWORD: ci-test-redis-password
        run: docker compose config --quiet

  runtime:
    name: Docker full-stack runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Boot isolated Compose stack and verify critical paths
        env:
          BCS_CI_RUNTIME_SMOKE: "1"
        run: bash scripts/docker-runtime-smoke.sh
