name: Regenerate Composer lockfile (temporary)
on:
  push:
    branches: [vks/phase55-main-integration]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: vks/phase55-main-integration
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Update Symfony security patches
        working-directory: backend
        run: composer update "symfony/*" --with-all-dependencies --no-interaction --no-progress
      - name: Verify Composer audit
        working-directory: backend
        run: composer audit --locked --no-interaction
      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- backend/composer.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/composer.lock
            git commit -m "fix(deps): update Symfony security patches"
            git push
          fi
