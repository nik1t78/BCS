server {
    listen 80;
    server_name _;

    # ===================== Безопасность (канон OWASP) =====================
    # Не показывать версию nginx
    server_tokens off;

    # Базовые security-заголовки для всего сайта
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: только свои источники (SPA + API на одном хосте). Разрешены inline-
    # стили (Tailwind/vite) и data:-изображения экспорта; скрипты — только same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Ограничение размера тела запроса (загрузка вложений)
    client_max_body_size 20m;

    # Frontend root (собранный React/Vite SPA)
    root /var/www/frontend;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ============================================================
    # Laravel backend (PHP-FPM)
    #
    # ВАЖНО: nginx видит только /var/www/backend/public (bind-mount),
    # поэтому вместо `root` используем alias + DOCUMENT_ROOT,
    # указывающий на реальный путь внутри контейнера backend
    # (/var/www/html/public). Иначе Laravel не находит vendor/
    # и отдаёт "File not found."
    # ============================================================

    # API запросы к Laravel
    location /api/ {
        alias /var/www/backend/public/;
        try_files $uri @laravel;
    }

    # Sanctum authentication
    location /sanctum/ {
        alias /var/www/backend/public/;
        try_files $uri @laravel;
    }

    # Статические файлы Laravel (storage:link)
    location /storage/ {
        alias /var/www/backend/public/storage/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Все php-запросы (в т.ч. из /api/, /sanctum/) — в PHP-FPM
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ============================================================
    # Server-Sent Events: GET /api/notifications/stream
    # Долгоживущий потоковый ответ (text/event-stream). Обычные правила к
    # нему не применимы: буферизация/gzip задерживают кадры, короткий
    # read_timeout роняет стрим. Конфигурация fastcgi здесь самодостаточна
    # (без internal redirect в @laravel — это исключает класс ошибок,
    # из-за которых стрим отдавал 500).
    # ============================================================
    location = /api/notifications/stream {
        gzip off;
        add_header X-Accel-Buffering "no" always;
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
        fastcgi_buffering off;
        fastcgi_cache off;
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 3600;
        fastcgi_read_timeout 3600;
    }

    # Фallback: любой не-статический запрос в бэкенде -> Laravel index.php
    location @laravel {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # ============================================================
    # Frontend (SPA)
    # ============================================================

    # Статические файлы фронтенда.
    # ВАЖНО: `try_files ... /index.html` для статики — ловушка: при
    # отсутствии файла браузер получал HTML с MIME text/html вместо CSS
    # ("Refused to apply style ... not a supported stylesheet MIME type",
    # из-за nosniff + строгой проверки типов). Правильный ответ для
    # отсутствующего ресурса — честный 404; SPA-fallback только в location /.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
        access_log off;
    }

    # SPA routing - все остальные запросы к frontend.
    # error_page привязан ВНУТРИ location / (а не на уровне server): иначе
    # любая 404 отсутствующего файла подменялась текстовым ответом и ломала
    # MIME-типы. Здесь подмена безопасна: этот путь отдаёт только HTML.
    location / {
        try_files $uri $uri/ /index.html;
        error_page 403 404 = @frontend_missing;
    }

    # Если index.html отсутствует (volume пустой / фронтенд не собран) —
    # вместо голой 403 показываем понятную инструкцию
    location @frontend_missing {
        default_type text/plain;
        return 200 "Frontend не найден (/var/www/frontend/index.html). Причина: volume frontend_build пуст.\n\nИсправление (PowerShell, в папке D:\server\BCS-main):\n  docker-compose down -v\n  docker-compose build --no-cache frontend\n  docker-compose up -d\n";
    }

    # Запрет доступа к скрытым файлам
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
