server {
    listen 80;
    server_name _;

    # Frontend root (собранный React/Vite SPA)
    root /var/www/frontend;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ============================================================
    # Laravel backend (PHP-FPM)
    #
    # ВАЖНО: nginx видит только /var/www/backend/public (bind-mount),
    # поэтому вместо `root` используем alias + DOCUMENT_ROOT,
    # указывающий на реальный путь внутри контейнера backend
    # (/var/www/html/public). Иначе Laravel не находит vendor/
    # и отдаёт "File not found."
    # ============================================================

    # API запросы к Laravel
    location /api/ {
        alias /var/www/backend/public/;
        try_files $uri @laravel;
    }

    # Sanctum authentication
    location /sanctum/ {
        alias /var/www/backend/public/;
        try_files $uri @laravel;
    }

    # Статические файлы Laravel (storage:link)
    location /storage/ {
        alias /var/www/backend/public/storage/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Все php-запросы (в т.ч. из /api/, /sanctum/) — в PHP-FPM
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Фallback: любой не-статический запрос в бэкенде -> Laravel index.php
    location @laravel {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # ============================================================
    # Frontend (SPA)
    # ============================================================

    # Статические файлы фронтенда
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
        access_log off;
    }

    # SPA routing - все остальные запросы к frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Если index.html отсутствует (volume пустой / фронтенд не собран) —
    # вместо голой 403 показываем понятную инструкцию
    error_page 403 404 = @frontend_missing;
    location @frontend_missing {
        default_type text/plain;
        return 200 "Frontend не найден (/var/www/frontend/index.html). Причина: volume frontend_build пуст.\n\nИсправление (PowerShell, в папке D:\server\BCS-main):\n  docker-compose down -v\n  docker-compose build --no-cache frontend\n  docker-compose up -d\n";
    }

    # Запрет доступа к скрытым файлам
    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
