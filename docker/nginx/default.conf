# ВАЖНО: limit_req_zone / limit_conn_zone — директивы уровня http.
# Файлы из /etc/nginx/conf.d/ включаются внутрь блока http, поэтому они
# должны быть ЗДЕСЬ, вне server {}. Внутри server nginx падает с ошибкой
# "directive is not allowed here".
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Разрешение имён сервисов через DNS Docker (127.0.0.11). Нужен, чтобы
# nginx не падал на старте с "host not found in upstream vks-bot", когда
# контейнер vks-bot не запущен (он опциональный, profile "bot"): при
# proxy_pass с переменной nginx резолвит имя уже во время запроса и
# отдаёт 502 вместо выхода из строя всего сервера.
resolver 127.0.0.11 valid=10s ipv6=off;

# Именованный формат лога (http-уровень). Используется в server{} ниже.
log_format vks_combined '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent"';

server {
    listen 80 reuseport backlog=1024;
    server_name _;

    # ===================== Скорость (быстрая отдача страниц) ================
    sendfile on; tcp_nopush on; tcp_nodelay on;

    # ===================== Безопасность (канон OWASP) =====================
    server_tokens off;

    # CORS для /api/ и /sanctum/: фронт и API на одном origin (nginx), но
    # запросы из iframe/других портов (dev Vite :5173, встраивание в портал)
    # обязаны проходить preflight — иначе браузер «логает» CORS-ошибки и
    # пользователи видят пустые страницы вместо данных.
    # $http_origin пустой только у не-браузерных клиентов -> отдаем 'self'.
    set $cors_origin $http_origin;
    if ($cors_origin = "") { set $cors_origin "$scheme://$host"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: только свои источники (SPA + API на одном хосте).
    # CSP: 'wasm-unsafe-eval' нужен для pdf.wasm (jsPDF — экспорт протоколов в PDF),
    # worker-src blob: — для Web Worker'ов сервис-воркера/PDF.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:" always;

    # Защита от перегрузки: таймауты и лимиты тел запросов
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 100;

    # Ограничение размера тела запроса (загрузка вложений)
    client_max_body_size 20m;

    root /var/www/frontend;
    index index.html;

    # ===================== Оптимизация места/трафика =====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    # Бротли, если модуль собран в образе (nginx:alpine — нет, но конфиг безопасен)

    # ============================================================
    # Laravel backend (PHP-FPM)
    # ============================================================
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        alias /var/www/backend/public/;

        # Preflight CORS: 204 без обращения к PHP — быстрее и без 4xx в консоли.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-XSRF-TOKEN, Accept, Origin" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            return 204;
        }

        try_files $uri @laravel;
    }

    # Realtime-поток уведомлений (Server-Sent Events). Буферизация nginx
    # убила бы стрим — уведомления приходили бы только при закрытии соединения.
    location = /api/notifications/stream {
        alias /var/www/backend/public/;
        try_files $uri @laravel_sse;
    }

    # ============================================================
    # Страница «экрана ожидания» в зале: /tv/{название зала}?token=...
    # Это НЕ часть SPA — Laravel-вьюха (web.php). Без этого блока URL
    # уходил бы в location / -> try_files -> /index.html, и браузер,
    # загружая модули по относительным путям, получал /tv/assets/*.js =
    # index.html -> "Failed to load module script ... MIME text/html".
    # Путь передаём PHP явно через fastcgi_path_info (без alias, который
    # не работает с регулярными location).
    # ============================================================
    location ~ ^/tv/ {
        limit_req zone=api burst=20 nodelay;
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_read_timeout 30s;
        # Экран ожидания — публичная blade-страница с inline-скриптом.
        # НЕ добавляем здесь Content-Security-Policy: Laravel (tvScreenResponse
        # в routes/web.php) сам отдаёт CSP с sha256-хэшем инлайн-скрипта экрана.
        # Два CSP-заголовка (nginx + PHP) браузер объединяет пересечением
        # директив, из-за чего хэш терялся и скрипт снова блокировался
        # («Executing inline script violates … script-src 'self' 'wasm-unsafe-eval'»).
        # ВНИМАНИЕ: директивы add_header НЕ наследуются в location, где есть
        # хотя бы одна своя add_header. Без повторения server-уровневого CSP
        # Laravel-заголовок оставался ЕДИНСТВЕННЫМ и браузер блокировал скрипт,
        # если хэш не совпал. Дублируем CSP с 'unsafe-inline' — экран работает
        # всегда (inline-скрипт один, наш собственный).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location /sanctum/ {
        limit_req zone=api burst=10 nodelay;
        alias /var/www/backend/public/;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-XSRF-TOKEN, Accept, Origin" always;
            add_header Access-Control-Max-Age "86400" always;
            add_header Content-Length 0 always;
            add_header Content-Type "text/plain charset=UTF-8" always;
            return 204;
        }

        try_files $uri @laravel;
    }

    # VKS-бот (Selenium, сервис vks-bot:8090). Проксирование нужно, чтобы
    # фронт дёргал бота по тому же origin (CSP connect-src 'self' и CORS).
    # Защита эндпоинта создания ВКС от посторонних (бот умеет ходить на
    # salutejazz.ru по чужую кнопку). ВКЛЮЧЕНИЕ в 2 шага:
    #   1) docker run --rm httpd:alpine htpasswd -Bbn "ВАШ_ЛОГИН" "ВАШ_ПАРОЛЬ" > docker/nginx/htpasswd
    #   2) в default.conf ниже заменить "auth_basic off;" на:
    #        auth_basic "VKS bot";  auth_basic_user_file /etc/nginx/.htpasswd;
    #   и раскомментировать монтирование htpasswd в docker-compose.yml.
    # Пока файл не создан — auth_basic выключен, всё работает как раньше.
    location = /vks-bot/create {
        auth_basic off;
        limit_req zone=api burst=10 nodelay;
        # Переменная в proxy_pass -> отложенный резолвинг (см. resolver выше):
        # nginx не падает, если контейнер vks-bot (profile "bot") не запущен.
        set $vks_bot_upstream vks-bot;
        proxy_pass http://$vks_bot_upstream:8090/create;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ОБЯЗАТЕЛЬНО: без этой строки nginx не передаёт секретный заголовок
        # в контейнер бота -> бот отвечает 401 "Bad or missing X-Bot-Token"
        # -> фронт показывает «Selenium-бот не смог создать встречу».
        proxy_set_header X-Bot-Token $http_x_bot_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # ВАЖНО: без завершающего слэша в proxy_pass путь проксируется как есть
    # (/vks-bot/health -> бот:8090/vks-bot/health -> 404). Со слэшом — отрезается
    # префикс (/vks-bot/health -> бот:8090/health), как и задумано.
    location /vks-bot/ {
        limit_req zone=api burst=10 nodelay;
        set $vks_bot_upstream vks-bot;
        proxy_pass http://$vks_bot_upstream:8090/;
        # (см. строку выше — слэш обязателен)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        # Selenium создаёт встречу до ~75 секунд — не обрываем долгий запрос
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Статические файлы Laravel (storage:link).
    # Напрямую из volume backend_storage (runtime-файлы приложения живут там —
    # bind-mount ./backend с хоста удалён, всё в образе/volumes).
    location /storage/ {
        alias /var/www/backend-storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        limit_conn perip 20;
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        # БЭКЕНД ЦЕЛИКОМ В ОБРАЗЕ: nginx больше НЕ монтирует ./backend, поэтому
        # путь /var/www/html/... внутри контейнера nginx не существует.
        # Реальный public/index.php — в контейнере backend по этому пути,
        # fastcgi передаёт именно его как SCRIPT_FILENAME (см. @laravel).
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location @laravel {
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        include fastcgi_params;
        # SCRIPT_FILENAME — путь ВНУТРИ контейнера backend (там реально лежит
        # index.php); DOCUMENT_ROOT — путь внутри nginx (volume backend_public).
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        # Аватар передаётся как base64 data-URL (до ~350 КБ после сжатия на фронте).
        # Без этих директив nginx отбрасывает PUT /api/profile с ошибкой 413,
        # картинка в профиле «не отображается» у всех пользователей.
        client_max_body_size 2m;
        client_body_buffer_size 1m;

        # CORS-заголовки на РЕАЛЬНЫЕ ответы API (preflight обработан выше).
        # Нужны, чтобы фронт из iframe/другого порта не получал ошибки CORS
        # («не логал» в консоли) и данные дорисовывались мгновенно.
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # SSE: никаких буферов, таймаут чтения длинный — поток живёт часами
    location @laravel_sse {
        set $backend_upstream backend:9000;
        fastcgi_pass $backend_upstream;
        include fastcgi_params;
        # (см. комментарий в @laravel: SCRIPT_FILENAME — путь контейнера backend)
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_buffering off;
        fastcgi_read_timeout 3600s;
        proxy_cache off;
        add_header X-Accel-Buffering no always;

        # CORS для SSE-стрима (см. @laravel)
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
    }

    # ============================================================
    # Frontend (SPA). Хэшированные ассеты Vite — immutable на год.
    # ============================================================
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html и sw.js НЕ кешируем — иначе обновления не доходят до клиентов.
    # no-cache = браузер ВСЕГДА пере validates файл у сервера (304, если не менялся),
    # поэтому после пересборки фронта пользователи получают свежий index.html
    # со ссылками на новые хэшированные assets БЕЗ Ctrl+F5.
    # must-revalidate обязателен: без него Firefox/Chrome могут отдать index.html
    # из memory cache при навигации «Назад». ETag включает nginx сам (по mtime+size).
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Корень SPA отдаёт index.html через try_files — заголовки выше к нему
    # НЕ применятся (add_header привязан к location = /index.html). Поэтому
    # для / тоже прописываем no-cache явно: иначе GET / (самый частый запрос)
    # закэшируется браузером на сессию и свежие релизы не будут видны.
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Если index.html отсутствует — понятная инструкция вместо голой 403
    error_page 403 404 = @frontend_missing;
    location @frontend_missing {
        default_type text/plain;
        return 200 "Frontend не найден (/var/www/frontend/index.html). Пересоберите: docker compose build --no-cache frontend && docker compose up -d\n";
    }

    # Запрет доступа к скрытым файлам (.env, .git и т.п.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Исправление: директива access_log с параметрами buffer=/flush= допустима
    # только при указании ИМЕНОВАННОГО формата (log_format). Раньше здесь стояло
    # "buffer=32k flush=5s" без имени формата -> nginx падал на старте:
    # [emerg] unknown log format "buffer=32k". Теперь используется формат vks_combined.
    # БУФЕР 64k + flush 5s: запись лога не блокирует отдачу страниц (скорость).
    access_log /var/log/nginx/access.log vks_combined buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;
}
