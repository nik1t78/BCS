server {
    listen 80;
    server_name _;

    # Frontend root (собранный React/Vite SPA)
    root /var/www/frontend;
    index index.html;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ============================================================
    # Laravel backend: все PHP-запросы обрабатываются через
    # /var/www/backend/public/index.php (фронт-контроллер)
    # ============================================================

    # API запросы к Laravel
    location /api/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Sanctum authentication
    location /sanctum/ {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Статические файлы Laravel (storage:link)
    location /storage/ {
        alias /var/www/backend/public/storage/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM для Laravel.
    # ВАЖНО: этот блок должен идти ДО location ~* \.(js|css...)$,
    # иначе nginx не будет корректно обрабатывать .php (или отдаст 403).
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        # Разрешаем исполнение ТОЛЬКО фронт-контроллера Laravel —
        # это защищает от исполнения загруженных файлов и от 403.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        # Таймауты
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;

        # Буферизация
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # ============================================================
    # Frontend (SPA)
    # ============================================================

    # Кэширование статических файлов фронтенда (js/css/картинки/шрифты).
    # try_files: если файла нет — падаем в /index.html (SPA routing),
    # а не отдаём 403/404.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.html;
        access_log off;
    }

    # SPA routing - все остальные запросы к frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запрет доступа к скрытым файлам
    location ~ /\.ht {
        deny all;
    }

    # Запрет доступа к .env
    location ~ /\.env {
        deny all;
    }

    # Логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
