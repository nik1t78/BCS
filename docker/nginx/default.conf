server {
    listen 80;
    server_name _;

    # ===================== Безопасность (канон OWASP) =====================
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # CSP: только свои источники (SPA + API на одном хосте).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Защита от перегрузки: таймауты и лимиты тел запросов
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 100;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # Ограничение размера тела запроса (загрузка вложений)
    client_max_body_size 20m;

    root /var/www/frontend;
    index index.html;

    # ===================== Оптимизация места/трафика =====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    # Бротли, если модуль собран в образе (nginx:alpine — нет, но конфиг безопасен)

    # ============================================================
    # Laravel backend (PHP-FPM)
    # ============================================================
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        alias /var/www/backend/public/;
        try_files $uri @laravel;
    }

    location /sanctum/ {
        limit_req zone=api burst=10 nodelay;
        alias /var/www/backend/public/;
        try_files $uri @laravel;
    }

    # Статические файлы Laravel (storage:link)
    location /storage/ {
        alias /var/www/backend/public/storage/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~ \.php$ {
        limit_conn perip 20;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;

        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location @laravel {
        fastcgi_pass backend:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type;
        fastcgi_param CONTENT_LENGTH $content_length;
    }

    # ============================================================
    # Frontend (SPA). Хэшированные ассеты Vite — immutable на год.
    # ============================================================
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri /index.html;
    }

    # index.html и sw.js НЕ кешируем — иначе обновления не доходят до клиентов
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Если index.html отсутствует — понятная инструкция вместо голой 403
    error_page 403 404 = @frontend_missing;
    location @frontend_missing {
        default_type text/plain;
        return 200 "Frontend не найден (/var/www/frontend/index.html). Пересоберите: docker compose build --no-cache frontend && docker compose up -d\n";
    }

    # Запрет доступа к скрытым файлам (.env, .git и т.п.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/access.log buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;
}
