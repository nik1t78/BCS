# =============================================================================
# BCS — полный стек: фронт (React/Vite), бэкенд (Laravel 12 php-fpm), nginx,
# MySQL, Redis. Файл намеренно минимальный: никакой «самолечащей» логики,
# только разворачивание готовых образов. Все образы собираются локально из
# Dockerfile в этом же репозитории (или берутся с Docker Hub как есть).
#
# Запуск:                docker compose up -d --build
# Статика Laravel:       docker compose run --rm backend-assets   (после сборки backend)
# Ключ приложения:       docker compose exec backend php artisan key:generate --show
# =============================================================================

x-defaults: &container-defaults
  deploy:
    resources:
      limits:
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

# Общая сборка backend-образа (используется сервисами ниже через YAML-якорь)
x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: runtime

# Общие runtime-тома бэкенда (код и vendor — внутри образа, не в bind-mount)
x-backend-volumes: &backend-volumes
  - type: volume
    source: backend_storage
    target: /var/www/html/storage
  - type: volume
    source: db_backups
    target: /var/www/html/storage/app/backups
  - type: volume
    source: backend_bootstrap_cache
    target: /var/www/html/bootstrap/cache

# Общие переменные окружения php-сервисов
x-backend-env: &backend-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
  DB_USERNAME: "${DB_USERNAME:-vks_user}"
  DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD не задан! Укажите длинный уникальный пароль в .env}"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD не задан! Укажите длинный уникальный пароль в .env}"
  APP_URL: "http://${SITE_IP:-localhost}"
  # APP_KEY ОБЯЗАТЕЛЕН: SESSION_DRIVER=cookie, поэтому при пустом/битом ключе
  # любой запрос к /api/* падает с HTTP 500 ("Unsupported cipher or incorrect key length").
  # Ключ должен начинаться с "base64:" и быть 32 байта в base64. Сгенерируйте:
  #   docker compose run --rm backend php artisan key:generate --show
  # и запишите результат в .env:  APP_KEY=base64:....
  APP_KEY: "${APP_KEY:?APP_KEY не задан! Добавьте в .env строку APP_KEY=base64:... (см. docker compose run --rm backend php artisan key:generate --show)}"
  APP_ENV: "${APP_ENV:-production}"
  APP_DEBUG: "false"
  # Единая таймзона приложения (совпадает с TZ контейнеров php-fpm/очередей).
  # Без неё Carbon считал wall-clock-время как UTC → «время не совпадает» на 3 часа.
  APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Moscow}"
  # Явно пробрасываем TZ во ВСЕ php-контейнеры (backend/queue/scheduler),
  # чтобы date()/cron-расписания жили в одном часовом поясе.
  TZ: "${TZ:-Europe/Moscow}"
  SESSION_DRIVER: cookie
  # Надёжный file cache и database queue: Redis остаётся необязательным.
  CACHE_STORE: "file"
  QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
  DB_QUEUE_RETRY_AFTER: "${DB_QUEUE_RETRY_AFTER:-300}"
  # Флаги автопилота ВКС-ссылок (см. php artisan vks:autopilot):
  VKSBOT_EXPECTED: "${VKSBOT_EXPECTED:-false}"
  VKSBOT_AUTO: "${VKSBOT_AUTO:-true}"
  VKSBOT_CHECK_MINUTES: "${VKSBOT_CHECK_MINUTES:-60}"
  BOT_TOKENS: "${BOT_TOKENS:-}"
  MESSENGER: "${MESSENGER:-max}"
  MAX_ENABLED: "${MAX_ENABLED:-true}"
  MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
  MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
  MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"

services:
  # Frontend (React + Vite): одноразовый сборщик -> volume frontend_build
  frontend:
    <<: *container-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # BUILD_ID можно изменить вручную для принудительной инвалидации слоя.
        # Обычный watchdog делает `compose up -d` БЕЗ сборки — это не должно
        # нагружать CPU каждые 5 минут. При релизе используйте `up -d --build`.
        BUILD_ID: "${BUILD_ID:-stable}"
    container_name: vks-frontend-builder
    restart: "no"
    networks: [vks-network]
    # Образ пересобирается только при установке/релизе через `--build`.
    # Watchdog запускает `compose up -d` без сборки, чтобы не нагружать CPU.
    volumes:
      - type: volume
        source: frontend_build
        target: /mnt/dist

  # Backend (php-fpm)
  backend:
    <<: *container-defaults
    build: *backend-build
    container_name: vks-backend
    restart: unless-stopped
    volumes: *backend-volumes
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    stop_grace_period: 30s
    networks: [vks-network]

  # Nginx: точка входа (порт 80), раздаёт фронт + static Laravel, фаст-cgi на backend
  nginx:
    <<: *container-defaults
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      - "${LISTEN_IP:-0.0.0.0}:80:80"
    volumes:
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: frontend_build
        target: /var/www/frontend
        read_only: true
      - type: volume
        source: backend_public
        target: /var/www/backend/public
        read_only: true
      - type: volume
        source: backend_storage
        target: /var/www/backend-storage
        read_only: true
    depends_on:
      frontend:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    networks: [vks-network]

  # Одноразовый экспортёр public/ из образа backend в volume backend_public.
  # Запускать после каждой пересборки backend-образа:
  #   docker compose run --rm backend-assets
  backend-assets:
    profiles: ["tools"]
    build: *backend-build
    container_name: vks-backend-assets
    restart: "no"
    command: sh -c 'cp -a /var/www/html/public/. /mnt/public/ && echo ">>> backend public extracted"'
    volumes:
      - type: volume
        source: backend_public
        target: /mnt/public
    networks: [vks-network]

  # MySQL (данные — в ./docker/mysql/data, переживают down/пересборки)
  mysql:
    <<: *container-defaults
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    shm_size: 64mb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD не задан! Укажите длинный уникальный пароль в .env}
      MYSQL_DATABASE: ${DB_DATABASE:-vks_schedule}
      MYSQL_USER: ${DB_USERNAME:-vks_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан! Укажите длинный уникальный пароль в .env}
    volumes:
      - type: bind
        source: ./docker/mysql/data
        target: /var/lib/mysql
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --table-definition-cache=400
      - --table-open-cache=400
      - --max-connections=80
      - --tmp-table-size=8M
      - --max-heap-table-size=16M
      - --innodb-log-buffer-size=8M
      # Flush committed transactions to durable storage; safer after sudden power loss.
      - --innodb-flush-log-at-trx-commit=1
      - --sync-binlog=1
      - --innodb-file-per-table=ON
      - --max-allowed-packet=64M
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD не задан! Укажите длинный уникальный пароль в .env}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [vks-network]

  # Redis (кэш/очереди/сессии; доступ только из внутренней сети)
  redis:
    <<: *container-defaults
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD:?REDIS_PASSWORD не задан! Укажите длинный уникальный пароль в .env}"
    command: >-
      redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD не задан! Укажите длинный уникальный пароль в .env}
      --save "" --appendonly no --proto-max-bulk-len 1mb
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>/dev/null | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    networks: [vks-network]

  # Laravel Queue Worker (migrations are run explicitly during deployment; workers never race migrations)
   # Laravel Queue Worker
  queue:
    <<: *container-defaults
    build: *backend-build
    container_name: vks-queue
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    command: >
      sh -c '
      php artisan queue:heartbeat >/dev/null 2>&1 & 
      (while true; do php artisan queue:work database --queue=vks,default --sleep=1 --tries=3 --timeout=240 --max-time=3600; sleep 1; done) & 
      (while true; do php artisan queue:work database --queue=vks,default --sleep=1 --tries=3 --timeout=240 --max-time=3600; sleep 1; done) & 
      wait'
    volumes: *backend-volumes
    environment:
      <<: *backend-env
      QUEUE_WORKERS: "${QUEUE_WORKERS:-2}"
      BCS_RUN_AS_WWW_DATA: "1"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[q]ueue:work' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 45s
    init: true
    networks: [vks-network]
  # Laravel Scheduler (migrations are run explicitly during deployment)
  scheduler:
    <<: *container-defaults
    build: *backend-build
    container_name: vks-scheduler
    restart: unless-stopped
    command: sh -c 'while true; do php artisan schedule:run --no-interaction & sleep 60; done'
    volumes: *backend-volumes
    environment:
      <<: *backend-env
      BCS_RUN_AS_WWW_DATA: "1"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps -ef | grep -q '[s]chedule:run' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    init: true
    networks: [vks-network]

  # Опциональный Selenium-бот ВКС (по умолчанию НЕ запускается):
  #   docker compose --profile bot up -d vks-bot
  vks-bot:
    profiles: ["bot"]
    build:
      context: ./vks-bot
      dockerfile: Dockerfile
    container_name: vks-bot
    ports:
      - "8090:8090"   
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
    shm_size: 512mb
    init: true
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BOT_HEADLESS: "1"
      BOT_PORT: "8090"
      BOT_TOKENS: "${BOT_TOKENS:-}"
      VKSBOT_CONCURRENCY: "${VKSBOT_CONCURRENCY:-2}"
      VKSBOT_QUEUE_LIMIT: "${VKSBOT_QUEUE_LIMIT:-20}"
      VKSBOT_ENGINE: "${VKSBOT_ENGINE:-playwright}"
      # Оптимизированный Playwright: повторное использование Chromium,
      # ожидание DOM вместо полной загрузки всех ресурсов.
      VKSBOT_TIMEOUT: "${VKSBOT_TIMEOUT:-90}"
      VKSBOT_GOTO_TIMEOUT_MS: "${VKSBOT_GOTO_TIMEOUT_MS:-45000}"
      VKSBOT_GOTO_ATTEMPTS: "${VKSBOT_GOTO_ATTEMPTS:-2}"
      TZ: "${TZ:-Europe/Moscow}"
    # Healthcheck: мониторинг доступности бота (используется и bot:monitor,
    # и `docker compose ps` — статус unhealthy виден сразу).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4); sys.exit(0 if r.status==200 else 1)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [vks-network]

networks:
  vks-network:
    driver: bridge

volumes:
  frontend_build:
  backend_storage:
  # Отдельный том для бэкапов БД (db:backup): бэкапы переживают пересоздание
  # основного storage-тома и не зависят от его заполнения. Монтируется
  # поверх /var/www/html/storage/app/backups в сервисах, использующих
  # x-backend-volumes.
  db_backups:
  backend_bootstrap_cache:
  backend_public:
