# Общие настройки лёгкости и безопасности для всех контейнеров:
# лимиты памяти, ротация логов, запрет повышения привилегий.
x-defaults: &container-defaults
  deploy:
    resources:
      limits:
        # 512M хватает php-fpm (pm.max_children=12 при 128M/процесс работают
        # лениво), mysql (buffer pool 64M) и redis (maxmemory 96mb).
        # Лимит CPU ("cpus") снят намеренно: одна full-сборка Vite + nginx +
        # php-fpm на 1 ядре приводят к таймаутам и 502 под нагрузкой.
        memory: 512M
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
# ВАЖНО: все переменные окружения в этом файле записаны как ${VAR:-default}, т.е.
# с дефолтом — docker compose не выдаёт предупреждений даже без заполненного .env,
# и `docker compose build` работает «из коробки». Реальные секреты (APP_KEY, пароли
# MySQL/Redis) берутся из ./backend/.env внутри контейнеров — см. README.
  # Frontend (React)
  frontend:
    <<: *container-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # "1" — включать автосоздание ссылок через Selenium-бота (жрёт ~1 ГБ RAM).
        # Значение берётся из .env (VITE_VKS_AUTOBOT), по умолчанию выключено.
        VITE_VKS_AUTOBOT: "${VITE_VKS_AUTOBOT:-0}"
        # Секрет для вызова бота (заголовок X-Bot-Token). Совпадает с BOT_TOKENS
        # для контейнера vks-bot; вшивается в JS при сборке фронта.
        VITE_VKS_BOT_TOKEN: "${BOT_TOKENS:-}"
    container_name: vks-frontend-builder
    restart: "no"   # одноразовый: собрал dist -> volume -> завершился, RAM не держит
    networks:
      - vks-network
    volumes:
      # Точка монтирования volume должна СОВПАДАТЬ с последней в Dockerfile
      # (/mnt/dist): при создании пустого volume docker копирует в него
      # содержимое образа по этому пути. CMD контейнера дополнительно
      # перезаписывает volume свежей сборкой.
      - type: volume
        source: frontend_build
        target: /mnt/dist

  # Backend (Laravel)
  backend:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
      # именованный контекст `repo` = корень репозитория: из него стадия
      # skeleton-stage забирает каркас docker/skeleton/laravel12/config/
      # (из основного контекста ./backend выйти вверх нельзя). Требует
      # compose >= 2.20 / buildkit >= 1.4; при сборке `docker build` без
      # compose стадия остаётся пустой и конфиги генерируются из ENV.
      additional_contexts:
        repo: .
      # multi-stage в backend/Dockerfile: собираем только стадию base,
      # composer-бинарник берётся из стадии composer-stage через COPY --from.
      target: runtime
    container_name: vks-backend
    restart: unless-stopped
    volumes:
      # ВСЁ ПРИЛОЖЕНИЕ ЖИВЁТ В ОБРАЗЕ (backend/Dockerfile, стадии app/runtime):
      # код, vendor и каркас storage доезжают до контейнера только через слои
      # образа — bind-mount ./backend УДАЛЁН намеренно (см. "боль 7" в шапке
      # Dockerfile). В volumes — исключительно runtime-данные:
      #  * backend_storage — uploads (/storage/app/*), логи, кэш файловый;
      #  * backend_bootstrap_cache — packages.php/services.php/config cache.
      # Пустой volume при первом `up` наполняется содержимым образа по той же
      # точке монтирования, поэтому рантайму не нужны ни сеть, ни composer.
      - type: volume
        source: backend_storage
        target: /var/www/html/storage
      - type: volume
        source: backend_bootstrap_cache
        target: /var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
      DB_USERNAME: "${DB_USERNAME:-vks_user}"
      # Пароль по умолчанию СОВПАДАЕТ с MYSQL_PASSWORD контейнера mysql,
      # иначе при отсутствии .env получаем "Access denied ... using password: NO"
      DB_PASSWORD: "${DB_PASSWORD:-vks_2026}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-vks_2026_redis}"
      REDIS_PORT: 6379
      APP_URL: "http://${SITE_IP:-localhost}"
      APP_KEY: "${APP_KEY:-dev-placeholder-key}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      MESSENGER: "${MESSENGER:-max}"
      MAX_ENABLED: "${MAX_ENABLED:-true}"
      MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"
      # Сессии/кэш ОСТАЮТСЯ в redis даже при временном отключении контейнера
      # redis (phpredis сам переподключается). Иначе при остановленном redis
      # rate-limiter на /auth/login падал с 500, а nginx отдавал 502.
      SESSION_DRIVER: cookie
      # Кэш/очередь по умолчанию в redis. Если redis недоступен, Laravel 12
      # при CACHE_STORE=redis падает с 500 на КАЖДОМ запросе (phpredis не может
      # подключиться) — nginx видит закрытое соединение и отдаёт 502. Поэтому
      # docker-entrypoint ниже проверяет доступность redis и тихо переключает
      # backend на file/database без перезапуска контейнера.
      CACHE_STORE: "${CACHE_STORE:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
    entrypoint:
      - sh
      - -c
      - |
        # Архитектура «всё в образе»: код, vendor и config/*.php доезжают до
        # контейнера ТОЛЬКО слоями образа (backend/Dockerfile, стадии app ->
        # runtime). Bind-mount ./backend из compose удалён, поэтому самолечение
        # вида «composer install на живую» / «чиним listen из entrypoint» больше
        # не нужно — всё это гарантирует сборка образа. Здесь остаётся только
        # то, что нельзя решить при build: секреты (.env/APP_KEY), права
        # runtime-volumes и деградация при недоступном redis.
        # ВНИМАНИЕ: переменные в коде PHP ниже экранированы как $$ — иначе
        # docker compose принимает их за свои подстановки и печатает
        # WARN[0000] The "s" variable is not set. Defaulting to a blank string.
        cd /var/www/html
        check_redis() {
          php -r '$$s=@fsockopen("redis",6379,$$e,$$m,2); if($$s){fwrite(STDOUT,"OK\n");exit(0);} fwrite(STDOUT,"FAIL\n");exit(1);' 2>/dev/null
        }
        if [ "$$(check_redis)" != "OK" ]; then
          echo "[vks] redis недоступен — переключаю кэш/очередь на file/database"
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=database/' /var/www/html/.env 2>/dev/null || true
        fi
        # .env из .env.example + APP_KEY (секреты в образ НЕ попадают по определению).
        if [ ! -f /var/www/html/.env ]; then
          echo "[vks] /var/www/html/.env отсутствует — создаю из .env.example"
          cp /var/www/html/.env.example /var/www/html/.env 2>/dev/null || : > /var/www/html/.env
          grep -q '^APP_KEY=' /var/www/html/.env 2>/dev/null || echo 'APP_KEY=' >> /var/www/html/.env
          sed -i 's/^APP_KEY=.*/APP_KEY=$$(head -c 32 /dev/urandom | base64)/' /var/www/html/.env
        fi
        # Права runtime-data: каталоги storage/ и bootstrap/cache смонтированы
        # named-volume'ами; их содержимое принадлежит root после автокопирования
        # образа — возвращаем владельца www-data при каждом старте.
        mkdir -p storage/app/public storage/app/tmp storage/app/backups \
                 storage/framework/cache/data storage/framework/sessions \
                 storage/framework/testing storage/framework/views \
                 storage/logs bootstrap/cache 2>/dev/null || true
        touch storage/logs/laravel.log 2>/dev/null || true
        chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || \
          echo '[vks] ВНИМАНИЕ: chown storage не удался (volume только для чтения?)'
        chmod -R 777 storage bootstrap/cache 2>/dev/null || true
        # Самолечение каркаса приложения. Обычно НЕ нужно (всё лежит в образе),
        # но защищает от двух реальных случаев: (а) volume backend_bootstrap_cache
        # создан на СТАРОМ образе и пуст; (б) разработчик временно вернул bind
        # ./backend из dev-оверрида и config/ там нет. Существующие файлы НЕ
        # трогаем — создаём только отсутствующие.
        mkdir -p config database/migrations public 2>/dev/null || true
        if [ ! -f config/app.php ]; then printf '%s\n' '<?php return [' '    "name" => getenv("APP_NAME") ?: "BCS",' '    "env" => getenv("APP_ENV") ?: "production",' '    "debug" => filter_var(getenv("APP_DEBUG") ?: "false", FILTER_VALIDATE_BOOLEAN),' '    "url" => rtrim(getenv("APP_URL") ?: "http://localhost", "/"),' '    "front_controller" => "index.php",' '    "key" => getenv("APP_KEY") ?: "",' '    "cipher" => "AES-256-CBC",' '];' > config/app.php; fi
        if [ ! -f config/database.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("DB_CONNECTION") ?: "mysql",' '    "connections" => [' '        "sqlite" => ["driver" => "sqlite", "database" => database_path("database.sqlite"), "prefix" => "", "foreign_key_constraints" => true],' '        "mysql" => ["driver" => "mysql", "host" => getenv("DB_HOST") ?: "127.0.0.1", "port" => getenv("DB_PORT") ?: "3306", "database" => getenv("DB_DATABASE") ?: "vks_schedule", "username" => getenv("DB_USERNAME") ?: "root", "password" => getenv("DB_PASSWORD") ?: "", "charset" => "utf8mb4", "collation" => "utf8mb4_unicode_ci", "prefix" => ""],' '    ],' '    "migrations" => ["table" => "migrations", "update_date_on_publish" => true],' '];' > config/database.php; fi
        if [ ! -f config/cache.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("CACHE_STORE") ?: "file",' '    "stores" => [' '        "array" => ["driver" => "array", "serialize" => false],' '        "file" => ["driver" => "file", "path" => storage_path("framework/cache/data"), "serialized" => false],' '        "redis" => ["driver" => "redis", "connection" => getenv("REDIS_CLIENT") ?: "phpredis", "options" => [], "key" => getenv("REDIS_DB") ?: 0],' '    ],' '    "prefix" => null,' '];' > config/cache.php; fi
        if [ ! -f config/session.php ]; then printf '%s\n' '<?php return [' '    "driver" => getenv("SESSION_DRIVER") ?: "cookie",' '    "lifetime" => 120,' '    "expire_on_close" => false,' '    "encrypt" => false,' '    "files" => storage_path("framework/sessions"),' '    "cookie" => "vks_session",' '    "path" => "/",' '    "domain" => null,' '    "secure" => false,' '    "http_only" => true,' '    "same_site" => "lax",' '];' > config/session.php; fi
        if [ ! -f config/queue.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("QUEUE_CONNECTION") ?: "database",' '    "connections" => [' '        "sync" => ["driver" => "sync"],' '        "database" => ["driver" => "database", "connection" => getenv("DB_CONNECTION") ?: "mysql", "table" => "jobs", "queue" => getenv("QUEUE_QUEUE") ?: "default"],' '        "redis" => ["driver" => "redis", "connection" => "default", "queue" => "default", "retry_after" => 90, "block_for" => null],' '    ],' '    "failed" => ["table" => "failed_jobs"],' '];' > config/queue.php; fi
        if [ ! -f config/logging.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("LOG_CHANNEL") ?: "stack",' '    "channels" => [' '        "stack" => ["driver" => "stack", "channels" => ["single"]],' '        "single" => ["driver" => "single", "path" => storage_path("logs/laravel.log"), "level" => "debug"],' '    ],' '];' > config/logging.php; fi

        # Статическая оптимизация Laravel (роуты/конфиги/views/events в PHP-кеш).
        # В фоне после старта fpm, чтобы не задерживать healthcheck.
        ( sleep 5
          cd /var/www/html
          php artisan config:cache >/dev/null 2>&1 || true
          php artisan route:cache   >/dev/null 2>&1 || true
          php artisan view:cache    >/dev/null 2>&1 || true
          php artisan event:cache   >/dev/null 2>&1 || true
        ) &
        exec php-fpm
    depends_on:
      - mysql
      - redis
    healthcheck:
      # Лёгкая TCP-проверка порта fpm вместо `artisan tinker`: tinker каждый
      # цикл поднимает полный бутстрап Laravel (~0.5с CPU + RAM на контейнер),
      # что «съедает» ресурсы у реальных запросов пользователей.
      test: ["CMD-SHELL", "pidof php-fpm >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vks-network

  # Nginx
  nginx:
    <<: *container-defaults
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      # Наружный порт ЗАФИКСИРОВАН = 80 (стандартный HTTP), поэтому сайт всегда
      # открывается БЕЗ порта в адресе: http://10.48.4.235/
      # LISTEN_IP задайте в .env как 127.0.0.1, если доступ нужен только с этой машины.
      - "${LISTEN_IP:-0.0.0.0}:80:80"
    volumes:
      # Long (explicit) syntax — immune to the legacy docker-compose v1
      # "too many colons" parser bug triggered by Windows drive paths.
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: frontend_build
        target: /var/www/frontend
        read_only: true
      # static-файлы Laravel public/ — из volume backend_public, наполненного
      # содержимым ОБРАЗА backend (сервис backend-assets, profile "tools").
      # Bind ./backend/public с хоста удалён: приложение целиком живёт в образе.
      - type: volume
        source: backend_public
        target: /var/www/backend/public
        read_only: true
      # Загрузки приложения (/storage/...): nginx отдаёт их напрямую из того же
      # named-volume backend_storage, который пишет php-fpm (контейнер backend).
      # Bind-mount ./backend с хоста удалён — приложение целиком живёт в образе,
      # runtime-данные в volumes; без этого монтирования /storage отдавал 404.
      - type: volume
        source: backend_storage
        target: /var/www/backend-storage
        read_only: true
      # Опциональная Basic-защита /vks-bot/create: создайте файл
      # docker/nginx/htpasswd (команда — в комментарии default.conf) и
      # включите auth_basic там же. Пока файла нет — строку не раскомментируйте,
      # иначе compose упадёт с "bind source path does not exist".
      # - type: bind
      #   source: ./docker/nginx/htpasswd
      #   target: /etc/nginx/.htpasswd
      #   read_only: true
    depends_on:
      - frontend
      - backend
    networks:
      - vks-network

  # Извлечение статики Laravel (public/) из ОБРАЗА backend в volume
  # backend_public, который читает nginx. Раньше nginx монтировал ./backend/public
  # с хоста; теперь весь бэкенд живёт только в образе (bind-mount удалены).
  # Запускать после каждой пересборки backend-образа:
  #   docker compose run --rm backend-assets
  # (либо один раз при первом деплое; содержимое volume переживает `down`).
  # В дефолтный `up` НЕ входит (profiles) — это одноразовый экспортёр, как
  # frontend выше, но без держания RAM.
  backend-assets:
    profiles: ["tools"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      # именованный контекст `repo` = корень репозитория: из него стадия
      # skeleton-stage забирает каркас docker/skeleton/laravel12/config/
      # (из основного контекста ./backend выйти вверх нельзя). Требует
      # compose >= 2.20 / buildkit >= 1.4; при сборке `docker build` без
      # compose стадия остаётся пустой и конфиги генерируются из ENV.
      additional_contexts:
        repo: .
      target: runtime
    container_name: vks-backend-assets
    restart: "no"
    command:
      - sh
      - -c
      - |
        cp -a /var/www/html/public/. /mnt/public/ && echo ">>> backend public extracted"
    volumes:
      - type: volume
        source: backend_public
        target: /mnt/public
    networks:
      - vks-network

  # MySQL
  mysql:
    <<: *container-defaults
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    shm_size: 64mb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-vks_2026_root}
      MYSQL_DATABASE: ${DB_DATABASE:-vks_schedule}
      MYSQL_USER: ${DB_USERNAME:-vks_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vks_2026}
    volumes:
      # Bind-mount: данные лежат в ./docker/mysql/data и НЕ удаляются
      # при `docker compose down`, пересборке образов или удалении volumes.
      - type: bind
        source: ./docker/mysql/data
        target: /var/lib/mysql
    # Порт наружу НЕ проброшен: доступ к БД только из внутренней сети
    # vks-network (backend/queue/scheduler). Для админ-подключения при
    # необходимости временно раскомментируйте строки ниже.
    # ports:
    #   - "127.0.0.1:3306:3306"
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --table-definition-cache=400
      - --table-open-cache=400
      - --max-connections=80
      - --tmp-table-size=8M
      - --max-heap-table-size=16M
      - --innodb-log-buffer-size=8M
    networks:
      - vks-network

  # Redis
  redis:
    <<: *container-defaults
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    # Только внутренняя сеть, лимит памяти и выгрузка старых ключей —
    # redis не съест оперативку; пароль обязателен.
    # Лимиты жёсткие: maxmemory 96mb — redis физически не сможет съесть больше;
    # allkeys-lru выгружает старые ключи; save '' отключает форк-копирование
    # при записи RDB (экономия памяти); aof только при наличии volume.
    command: >-
      redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-vks_2026_redis}
      --save "" --appendonly no --proto-max-bulk-len 1mb
    networks:
      - vks-network

  # Laravel Queue Worker
  queue:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
      # именованный контекст `repo` = корень репозитория: из него стадия
      # skeleton-stage забирает каркас docker/skeleton/laravel12/config/
      # (из основного контекста ./backend выйти вверх нельзя). Требует
      # compose >= 2.20 / buildkit >= 1.4; при сборке `docker build` без
      # compose стадия остаётся пустой и конфиги генерируются из ENV.
      additional_contexts:
        repo: .
      # multi-stage в backend/Dockerfile: собираем только стадию base,
      # composer-бинарник берётся из стадии composer-stage через COPY --from.
      target: runtime
    container_name: vks-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      # Код и vendor — только из образа (bind-mount ./backend удалён, см.
      # комментарий у сервиса backend). Очереди пишут те же runtime-данные,
      # что и php-fpm, поэтому том storage общий.
      - type: volume
        source: backend_storage
        target: /var/www/html/storage
      - type: volume
        source: backend_bootstrap_cache
        target: /var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
      DB_USERNAME: "${DB_USERNAME:-vks_user}"
      DB_PASSWORD: "${DB_PASSWORD:-vks_2026}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-vks_2026_redis}"
      REDIS_PORT: 6379
      APP_URL: "http://${SITE_IP:-localhost}"
      APP_KEY: "${APP_KEY:-dev-placeholder-key}"
      MESSENGER: "${MESSENGER:-max}"
      MAX_ENABLED: "${MAX_ENABLED:-true}"
      MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"
    depends_on:
      - backend
      - redis
    networks:
      - vks-network

  # Laravel Scheduler
  scheduler:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
      # именованный контекст `repo` = корень репозитория: из него стадия
      # skeleton-stage забирает каркас docker/skeleton/laravel12/config/
      # (из основного контекста ./backend выйти вверх нельзя). Требует
      # compose >= 2.20 / buildkit >= 1.4; при сборке `docker build` без
      # compose стадия остаётся пустой и конфиги генерируются из ENV.
      additional_contexts:
        repo: .
      # multi-stage в backend/Dockerfile: собираем только стадию base,
      # composer-бинарник берётся из стадии composer-stage через COPY --from.
      target: runtime
    container_name: vks-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      # Код и vendor — только из образа (bind-mount ./backend удалён, см.
      # комментарий у сервиса backend). Очереди пишут те же runtime-данные,
      # что и php-fpm, поэтому том storage общий.
      - type: volume
        source: backend_storage
        target: /var/www/html/storage
      - type: volume
        source: backend_bootstrap_cache
        target: /var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
      DB_USERNAME: "${DB_USERNAME:-vks_user}"
      DB_PASSWORD: "${DB_PASSWORD:-vks_2026}"
      APP_URL: "http://${SITE_IP:-localhost}"
      APP_KEY: "${APP_KEY:-dev-placeholder-key}"
      MESSENGER: "${MESSENGER:-max}"
      MAX_ENABLED: "${MAX_ENABLED:-true}"
      MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"
    depends_on:
      - backend
    networks:
      - vks-network

  # VKS-бот (Selenium): автоматически создаёт встречи на salutejazz.ru.
  # Фронт обращается к нему через nginx: /vks-bot/ -> http://vks-bot:8090/
  # ВАЖНО: сервис опциональный и НЕ запускается по умолчанию (profiles:
  # ["bot"]). Chromium внутри контейнера занимает ~0,8–1 ГБ RAM на время
  # каждого создания ссылки; без бота фронт мгновенно генерирует ссылку
  # локально в том же формате платформы — всё работает так же.
  # Включить бота: docker compose --profile bot up -d vks-bot
  # + VITE_VKS_AUTOBOT=1 при сборке фронта.
  vks-bot:
    profiles: ["bot"]
    build:
      context: ./vks-bot
      dockerfile: Dockerfile
    container_name: vks-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    shm_size: 256mb   # иначе Chromium падает в headless из-за маленького /dev/shm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BOT_HEADLESS: "1"
      BOT_PORT: "8090"
      # Секрет для вызова бота (заголовок X-Bot-Token). Задайте свой в .env!
      BOT_TOKENS: "${BOT_TOKENS:-}"
    networks:
      - vks-network

networks:
  vks-network:
    driver: bridge

volumes:
  frontend_build:
  # Runtime-данные бэкенда (uploads/logs/framework cache) — переживают
  # `down`/пересборку образов; код и vendor в них НЕ хранятся (они в образе).
  backend_storage:
  backend_bootstrap_cache:
  # Копия backend/public из образа — её читает nginx (static-ресурсы Laravel).
  backend_public:
