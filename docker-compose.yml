# Общие настройки лёгкости и безопасности для всех контейнеров:
# лимиты памяти, ротация логов, запрет повышения привилегий.
x-defaults: &container-defaults
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
  # Frontend (React)
  frontend:
    <<: *container-defaults
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vks-frontend-builder
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - vks-network
    volumes:
      # Точка монтирования volume должна СОВПАДАТЬ с последней в Dockerfile
      # (/mnt/dist): при создании пустого volume docker копирует в него
      # содержимое образа по этому пути. CMD контейнера дополнительно
      # перезаписывает volume свежей сборкой.
      - type: volume
        source: frontend_build
        target: /mnt/dist

  # Backend (Laravel)
  backend:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-backend
    restart: unless-stopped
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
      - type: bind
        source: ./backend/storage
        target: /var/www/html/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-vks_schedule}
      - DB_USERNAME=${DB_USERNAME:-vks_user}
      - DB_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в файле .env рядом с docker-compose.yml}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Укажите REDIS_PASSWORD в файле .env}
      - REDIS_PORT=6379
      - APP_KEY=${APP_KEY:?Укажите APP_KEY в .env (сгенерировать: php artisan key:generate)}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=false
      - MESSENGER=${MESSENGER:-max}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN:-}
    depends_on:
      - mysql
      - redis
    networks:
      - vks-network

  # Nginx
  nginx:
    <<: *container-defaults
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Long (explicit) syntax — immune to the legacy docker-compose v1
      # "too many colons" parser bug triggered by Windows drive paths.
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: frontend_build
        target: /var/www/frontend
        read_only: true
      - type: bind
        source: ./backend/public
        target: /var/www/backend/public
        read_only: true
    depends_on:
      - frontend
      - backend
    networks:
      - vks-network

  # MySQL
  mysql:
    <<: *container-defaults
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Укажите DB_ROOT_PASSWORD в файле .env}
      MYSQL_DATABASE: ${DB_DATABASE:-vks_schedule}
      MYSQL_USER: ${DB_USERNAME:-vks_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Укажите DB_PASSWORD в файле .env}
    volumes:
      # Bind-mount: данные лежат в ./docker/mysql/data и НЕ удаляются
      # при `docker compose down`, пересборке образов или удалении volumes.
      - type: bind
        source: ./docker/mysql/data
        target: /var/lib/mysql
    # Порт наружу НЕ проброшен: доступ к БД только из внутренней сети
    # vks-network (backend/queue/scheduler). Для админ-подключения при
    # необходимости временно раскомментируйте строки ниже.
    # ports:
    #   - "127.0.0.1:3306:3306"
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=200
    networks:
      - vks-network

  # Redis
  redis:
    <<: *container-defaults
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    # Только внутренняя сеть, лимит памяти и выгрузка старых ключей —
    # redis не съест оперативку; пароль обязателен.
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?Укажите REDIS_PASSWORD в файле .env}
    networks:
      - vks-network

  # Laravel Queue Worker
  queue:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-vks_schedule}
      - DB_USERNAME=${DB_USERNAME:-vks_user}
      - DB_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в файле .env рядом с docker-compose.yml}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Укажите REDIS_PASSWORD в файле .env}
      - REDIS_PORT=6379
      - APP_KEY=${APP_KEY:?Укажите APP_KEY в .env}
      - MESSENGER=${MESSENGER:-max}
      - MAX_BOT_TOKEN=${MAX_BOT_TOKEN:-}
    depends_on:
      - backend
      - redis
    networks:
      - vks-network

  # Laravel Scheduler
  scheduler:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-vks_schedule}
      - DB_USERNAME=${DB_USERNAME:-vks_user}
      - DB_PASSWORD=${DB_PASSWORD:?Укажите DB_PASSWORD в файле .env рядом с docker-compose.yml}
      - APP_KEY=${APP_KEY:?Укажите APP_KEY в .env}
    depends_on:
      - backend
    networks:
      - vks-network

networks:
  vks-network:
    driver: bridge

volumes:
  frontend_build:
