version: '3.8'

services:
  # Frontend (React)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vks-frontend
    restart: unless-stopped
    networks:
      - vks-network
    volumes:
      - frontend_build:/app/dist

  # Backend (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-backend
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./backend/storage:/var/www/html/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vks_schedule
      - DB_USERNAME=vks_user
      - DB_PASSWORD=vks_password_2024
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - vks-network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - frontend_build:/var/www/frontend
      - ./backend/public:/var/www/backend/public
    depends_on:
      - frontend
      - backend
    networks:
      - vks-network

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2024
      MYSQL_DATABASE: vks_schedule
      MYSQL_USER: vks_user
      MYSQL_PASSWORD: vks_password_2024
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - vks-network
    command: --default-authentication-plugin=mysql_native_password

  # Redis
  redis:
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    networks:
      - vks-network

  # Laravel Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vks_schedule
      - DB_USERNAME=vks_user
      - DB_PASSWORD=vks_password_2024
    depends_on:
      - backend
      - redis
    networks:
      - vks-network

  # Laravel Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./backend:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vks_schedule
      - DB_USERNAME=vks_user
      - DB_PASSWORD=vks_password_2024
    depends_on:
      - backend
    networks:
      - vks-network

networks:
  vks-network:
    driver: bridge

volumes:
  mysql_data:
  frontend_build:
