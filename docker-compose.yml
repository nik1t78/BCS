services:
  # Frontend (React)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vks-frontend-builder
    restart: "no"
    networks:
      - vks-network
    volumes:
      # Точка монтирования volume должна СОВПАДАТЬ с последней в Dockerfile
      # (/mnt/dist): при создании пустого volume docker копирует в него
      # содержимое образа по этому пути. CMD контейнера дополнительно
      # перезаписывает volume свежей сборкой.
      - type: volume
        source: frontend_build
        target: /mnt/dist

  # Backend (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-backend
    restart: unless-stopped
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
      - type: bind
        source: ./backend/storage
        target: /var/www/html/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vks_schedule
      - DB_USERNAME=vks_user
      - DB_PASSWORD=vks_password_2024
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - vks-network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Long (explicit) syntax — immune to the legacy docker-compose v1
      # "too many colons" parser bug triggered by Windows drive paths.
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: frontend_build
        target: /var/www/frontend
        read_only: true
      - type: bind
        source: ./backend/public
        target: /var/www/backend/public
        read_only: true
    depends_on:
      - frontend
      - backend
    networks:
      - vks-network

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_2024
      MYSQL_DATABASE: vks_schedule
      MYSQL_USER: vks_user
      MYSQL_PASSWORD: vks_password_2024
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: volume
        source: mysql_data
        target: /var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - vks-network

  # Redis
  redis:
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    networks:
      - vks-network

  # Laravel Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vks_schedule
      - DB_USERNAME=vks_user
      - DB_PASSWORD=vks_password_2024
    depends_on:
      - backend
      - redis
    networks:
      - vks-network

  # Laravel Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=vks_schedule
      - DB_USERNAME=vks_user
      - DB_PASSWORD=vks_password_2024
    depends_on:
      - backend
    networks:
      - vks-network

networks:
  vks-network:
    driver: bridge

volumes:
  mysql_data:
  frontend_build:
