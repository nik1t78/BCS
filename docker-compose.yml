# Общие настройки лёгкости и безопасности для всех контейнеров:
# лимиты памяти, ротация логов, запрет повышения привилегий.
x-defaults: &container-defaults
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "1.0"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

services:
# ВАЖНО: все переменные окружения в этом файле записаны как ${VAR:-default}, т.е.
# с дефолтом — docker compose не выдаёт предупреждений даже без заполненного .env,
# и `docker compose build` работает «из коробки». Реальные секреты (APP_KEY, пароли
# MySQL/Redis) берутся из ./backend/.env внутри контейнеров — см. README.
  # Frontend (React)
  frontend:
    <<: *container-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # "1" — включать автосоздание ссылок через Selenium-бота (жрёт ~1 ГБ RAM).
        # Значение берётся из .env (VITE_VKS_AUTOBOT), по умолчанию выключено.
        VITE_VKS_AUTOBOT: "${VITE_VKS_AUTOBOT:-0}"
        # Секрет для вызова бота (заголовок X-Bot-Token). Совпадает с BOT_TOKENS
        # для контейнера vks-bot; вшивается в JS при сборке фронта.
        VITE_VKS_BOT_TOKEN: "${BOT_TOKENS:-}"
    container_name: vks-frontend-builder
    restart: "no"   # одноразовый: собрал dist -> volume -> завершился, RAM не держит
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    networks:
      - vks-network
    volumes:
      # Точка монтирования volume должна СОВПАДАТЬ с последней в Dockerfile
      # (/mnt/dist): при создании пустого volume docker копирует в него
      # содержимое образа по этому пути. CMD контейнера дополнительно
      # перезаписывает volume свежей сборкой.
      - type: volume
        source: frontend_build
        target: /mnt/dist

  # Backend (Laravel)
  backend:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-backend
    restart: unless-stopped
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
      - type: bind
        source: ./backend/storage
        target: /var/www/html/storage
      # vendor смонтирован из именованного volume: в ./backend/vendor лежат
      # dev-пакеты (faker), а bind-mount целиком перекрывал бы prod-vendor
      # из образа. При создании volume docker копирует в него содержимое
      # образа по этому пути — там уже правильный --no-dev набор.
      - type: volume
        source: backend_vendor
        target: /var/www/html/vendor
      - type: volume
        source: backend_bootstrap_cache
        target: /var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
      DB_USERNAME: "${DB_USERNAME:-vks_user}"
      # Пароль по умолчанию СОВПАДАЕТ с MYSQL_PASSWORD контейнера mysql,
      # иначе при отсутствии .env получаем "Access denied ... using password: NO"
      DB_PASSWORD: "${DB_PASSWORD:-vks_2026}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-vks_2026_redis}"
      REDIS_PORT: 6379
      APP_URL: "http://${SITE_IP:-localhost}"
      APP_KEY: "${APP_KEY:-dev-placeholder-key}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "false"
      MESSENGER: "${MESSENGER:-max}"
      MAX_ENABLED: "${MAX_ENABLED:-true}"
      MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"
      # Сессии/кэш ОСТАЮТСЯ в redis даже при временном отключении контейнера
      # redis (phpredis сам переподключается). Иначе при остановленном redis
      # rate-limiter на /auth/login падал с 500, а nginx отдавал 502.
      SESSION_DRIVER: cookie
      # Кэш/очередь по умолчанию в redis. Если redis недоступен, Laravel 12
      # при CACHE_STORE=redis падает с 500 на КАЖДОМ запросе (phpredis не может
      # подключиться) — nginx видит закрытое соединение и отдаёт 502. Поэтому
      # docker-entrypoint ниже проверяет доступность redis и тихо переключает
      # backend на file/database без перезапуска контейнера.
      CACHE_STORE: "${CACHE_STORE:-redis}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-redis}"
    entrypoint:
      - sh
      - -c
      - |
        # ВНИМАНИЕ: переменные в коде PHP ниже экранированы как $$ — иначе
        # docker compose принимает их за свои подстановки и печатает
        # WARN[0000] The "s" variable is not set. Defaulting to a blank string.
        check_redis() {
          php -r '$$s=@fsockopen("redis",6379,$$e,$$m,2); if($$s){fwrite(STDOUT,"OK\n");exit(0);} fwrite(STDOUT,"FAIL\n");exit(1);' 2>/dev/null
        }
        if [ "$$(check_redis)" != "OK" ]; then
          echo "[vks] redis недоступен — переключаю кэш/очередь на file/database"
          sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/; s/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=database/' /var/www/html/.env 2>/dev/null || true
        fi
        # Самолечение vendor: если ./backend/vendor (bind) или том backend_vendor
        # содержат autoload, собранный под другую версию PHP (например, локально
        # на Windows был запущен composer install), artisan падает с
        # "Composer detected issues in your platform ... >= 8.4.1".
        # Переустанавливаем зависимости внутри контейнера (PHP образа) в обход
        # platform_check. Требуется интернет при первом запуске после git pull.
        if ! php -r "require '/var/www/html/vendor/autoload.php';" >/dev/null 2>&1; then
          echo "[vks] vendor несовместим с PHP этого образа — выполняю composer install ..."
          (cd /var/www/html && composer install --no-dev --prefer-dist --no-interaction --no-scripts --ignore-platform-req=php+) || \
            echo "[vks] ВНИМАНИЕ: composer install не удался (нет сети?) — проверьте вручную: docker compose exec backend composer install --no-dev --ignore-platform-req=php+"
        fi
        # Создаём .env из .env.example (он есть в репозитории) и генерируем APP_KEY.
        if [ ! -f /var/www/html/.env ]; then
          echo "[vks] /var/www/html/.env отсутствует — создаю из .env.example"
          cp /var/www/html/.env.example /var/www/html/.env 2>/dev/null || : > /var/www/html/.env
          grep -q '^APP_KEY=' /var/www/html/.env 2>/dev/null || echo 'APP_KEY=' >> /var/www/html/.env
          sed -i 's/^APP_KEY=.*/APP_KEY=$$(head -c 32 /dev/urandom | base64)/' /var/www/html/.env
        fi
        # Каркас Laravel на свежем клоне: config/*.php и database/migrations
        # намеренно не лежат в git (секреты/локальные конфиги) — без них
        # artisan падает («No application encryption key», «call to a member
        # function connection() on null»), healthcheck не проходит, контейнер
        # unhealthy -> весь стек выглядит «неработающим». Создаём недостающее
        # ТОЛЬКО если файлов нет (существующие НЕ трогаем).
        mkdir -p /var/www/html/config /var/www/html/database/migrations
        if [ ! -f /var/www/html/config/app.php ]; then printf '%s\n' '<?php return [' '    "name" => getenv("APP_NAME") ?: "BCS",' '    "env" => getenv("APP_ENV") ?: "production",' '    "debug" => filter_var(getenv("APP_DEBUG") ?: "false", FILTER_VALIDATE_BOOLEAN),' '    "url" => rtrim(getenv("APP_URL") ?: "http://localhost", "/"),' '    "front_controller" => "index.php",' '    "key" => getenv("APP_KEY") ?: "",' '    "cipher" => "AES-256-CBC",' '];' > /var/www/html/config/app.php; fi
        if [ ! -f /var/www/html/config/database.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("DB_CONNECTION") ?: "mysql",' '    "connections" => [' '        "sqlite" => ["driver" => "sqlite", "url" => env("DB_URL"), "database" => database_path("database.sqlite"), "prefix" => "", "foreign_key_constraints" => true],' '        "mysql" => ["driver" => "mysql", "url" => env("DB_URL"), "host" => getenv("DB_HOST") ?: "127.0.0.1", "port" => getenv("DB_PORT") ?: "3306", "database" => getenv("DB_DATABASE") ?: "vks_schedule", "username" => getenv("DB_USERNAME") ?: "root", "password" => getenv("DB_PASSWORD") ?: "", "charset" => "utf8mb4", "collation" => "utf8mb4_unicode_ci", "prefix" => ""],' '        "mariadb" => ["driver" => "mariadb", "url" => env("DB_URL"), "host" => getenv("DB_HOST") ?: "127.0.0.1", "port" => getenv("DB_PORT") ?: "3306", "database" => getenv("DB_DATABASE") ?: "vks_schedule", "username" => getenv("DB_USERNAME") ?: "root", "password" => getenv("DB_PASSWORD") ?: "", "charset" => "utf8mb4", "collation" => "utf8mb4_unicode_ci", "prefix" => ""],' '        "pgsql" => ["driver" => "pgsql", "url" => env("DB_URL"), "host" => getenv("DB_HOST") ?: "127.0.0.1", "port" => getenv("DB_PORT") ?: "5432", "database" => getenv("DB_DATABASE") ?: "vks_schedule", "username" => getenv("DB_USERNAME") ?: "root", "password" => getenv("DB_PASSWORD") ?: "", "charset" => "utf8", "prefix" => "", "schema_search_path" => "public"],' '    ],' '    "migrations" => ["table" => "migrations", "update_date_on_publish" => true],' '];' > /var/www/html/config/database.php; fi
        if [ ! -f /var/www/html/config/cache.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("CACHE_STORE") ?: "file",' '    "stores" => [' '        "array" => ["driver" => "array", "serialize" => false],' '        "file" => ["driver" => "file", "path" => storage_path("framework/cache/data"), "serialized" => false],' '        "redis" => ["driver" => "redis", "connection" => getenv("REDIS_CLIENT") ?: "phpredis", "options" => [], "key" => getenv("REDIS_DB") ?: "0"],' '    ],' '    "prefix" => null,' '];' > /var/www/html/config/cache.php; fi
        if [ ! -f /var/www/html/config/session.php ]; then printf '%s\n' '<?php return [' '    "driver" => getenv("SESSION_DRIVER") ?: "cookie",' '    "lifetime" => 120,' '    "expire_on_close" => false,' '    "encrypt" => false,' '    "files" => storage_path("framework/sessions"),' '    "cookie" => "vks_session",' '    "path" => "/",', '    "domain" => null,' '    "secure" => false,' '    "http_only" => true,' '    "same_site" => "lax",' '];' > /var/www/html/config/session.php; fi
        if [ ! -f /var/www/html/config/queue.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("QUEUE_CONNECTION") ?: "database",' '    "connections" => [' '        "sync" => ["driver" => "sync"],' '        "database" => ["driver" => "database", "connection" => getenv("DB_CONNECTION") ?: "mysql", "table" => "jobs", "queue" => getenv("QUEUE_QUEUE") ?: "default"],' '        "redis" => ["driver" => "redis", "connection" => "default", "queue" => "default", "retry_after" => 90, "block_for" => null],' '    ],' '    "failed" => ["table" => "failed_jobs"],' '];' > /var/www/html/config/queue.php; fi
        if [ ! -f /var/www/html/config/logging.php ]; then printf '%s\n' '<?php return [' '    "default" => getenv("LOG_CHANNEL") ?: "stack",' '    "channels" => [' '        "stack" => ["driver" => "stack", "channels" => ["single"]],' '        "single" => ["driver" => "single", "path" => storage_path("logs/laravel.log"), "level" => "debug"],' '    ],' '];' > /var/www/html/config/logging.php; fi
        if [ -z "$$(ls -A /var/www/html/database/migrations 2>/dev/null)" ]; then printf '%s\n' '<?php' '' 'use Illuminate\\Database\\Migrations\\Migration;' 'use Illuminate\\Database\\Schema\\Blueprint;' 'use Illuminate\\Support\\Facades\\Schema;' '' 'return new class extends Migration' '{' '    public function up(): void' '    {' '        Schema::create("users", function (Blueprint $$table) {' '            $$table->id();' '            $$table->string("name");' '            $$table->string("email")->unique();' '            $$table->timestamp("email_verified_at")->nullable();' '            $$table->string("password");' '            $$table->rememberToken();' '            $$table->timestamps();' '        });' '    }' '' '    public function down(): void' '    {' '        Schema::dropIfExists("users");' '    }' '};' > /var/www/html/database/migrations/0001_01_01_000000_create_users_table.php; fi
        # Самолечение прав storage/: ./backend/storage смонтирован с хоста bind-маунтом.
        # На Linux-сервере каталог может принадлежать root (после git clone / rsync),
        # тогда php-fpm (www-data) не может открыть storage/logs/laravel.log и
        # `php artisan optimize` падает с "Failed to open stream: Permission denied"
        # ровно на шаге views. Создаём каркас и чиним владельца/права при каждом старте.
        mkdir -p storage/app/public storage/app/tmp storage/app/backups \
                 storage/framework/cache/data storage/framework/sessions \
                 storage/framework/testing storage/framework/views \
                 storage/logs bootstrap/cache 2>/dev/null || true
        touch storage/logs/laravel.log 2>/dev/null || true
        chown -R www-data:www-data storage bootstrap/cache 2>/dev/null || \
          echo '[vks] ВНИМАНИЕ: chown storage не удался (bind-mount только для чтения?)'
        chmod -R ug+rwX,o+rX storage 2>/dev/null || true
        # Если файл laravel.log уже создан другим пользователем (например, root из
        # прошлых `docker compose exec`), append от www-data будет отвергнут ядром —
        # удаляем и пересоздаём его от имени www-data.
        if ! su -s /bin/sh www-data -c 'test -w storage/logs/laravel.log' 2>/dev/null; then
          echo '[vks] storage/logs/laravel.log недоступен для записи www-data — пересоздаю'
          rm -f storage/logs/laravel.log 2>/dev/null || true
          touch storage/logs/laravel.log && chown www-data:www-data storage/logs/laravel.log
        fi
        # Самолечение TCP-listen: nginx стучится на backend:9000, а базовый
        # образ php-fpm-alpine по умолчанию слушает UNIX-сокет -> 502 refused.
        if ! grep -qs 'listen = 0.0.0.0:9000' /usr/local/etc/php-fpm.d/zz-listen.conf; then
          echo '[vks] чиню php-fpm listen -> 0.0.0.0:9000'
          { echo '[www]'
            echo 'listen = 0.0.0.0:9000'
            echo 'clear_env = no'
            # pm = static: при 512M лимите контейнера dynamic пул неэффективен —
            # сразу держим фиксированное число процессов (каждый ~50-70MB RAM).
            echo 'pm = static'
            echo 'pm.max_children = 6'
            echo 'pm.max_requests = 500'
            echo 'php_admin_value[memory_limit] = 128M'; } > /usr/local/etc/php-fpm.d/zz-listen.conf
        fi
        # OPcache: JIT tracing выключен намеренно — на alpine/musl он нестабилен
        # и даёт прирост только на CPU-тяжёлых циклах; для I/O-bound Laravel
        # достаточно кеша байткода + статического кеша классов/конфигов/роутов.
        { echo 'opcache.enable=1'
          echo 'opcache.enable_cli=0'
          echo 'opcache.memory_consumption=96'
          echo 'opcache.interned_strings_buffer=16'
          echo 'opcache.max_accelerated_files=20000'
          # validate_timestamps=1 + revalidate_freq=2: код смонтирован с хоста
          # (bind ./backend), правки PHP должны вступать без ребилда образа —
          # иначе выглядит как «докер не работает» (старый байткод держится в памяти).
          echo 'opcache.validate_timestamps=1'
          echo 'opcache.revalidate_freq=2'
          echo 'opcache.save_comments=1'
          echo 'opcache.fast_shutdown=1'; } > /usr/local/etc/php/conf.d/zz-opcache-tune.ini 2>/dev/null || true
        # Статическая оптимизация Laravel (сборка роутов/конфигов/views в PHP).
        # Выполняется в фоне после старта fpm, чтобы не задерживать healthcheck;
        # deploy.sh пересобирает кеш после git pull, здесь — первичный прогрев.
        ( sleep 5
          cd /var/www/html
          php artisan config:cache >/dev/null 2>&1 || true
          php artisan route:cache   >/dev/null 2>&1 || true
          php artisan view:cache    >/dev/null 2>&1 || true
          php artisan event:cache   >/dev/null 2>&1 || true
        ) &
        exec php-fpm
    depends_on:
      - mysql
      - redis
    healthcheck:
      test: ["CMD-SHELL", "php artisan tinker --execute='echo ok;' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - vks-network

  # Nginx
  nginx:
    <<: *container-defaults
    image: nginx:alpine
    container_name: vks-nginx
    restart: unless-stopped
    ports:
      # Наружный порт ЗАФИКСИРОВАН = 80 (стандартный HTTP), поэтому сайт всегда
      # открывается БЕЗ порта в адресе: http://10.48.4.235/
      # LISTEN_IP задайте в .env как 127.0.0.1, если доступ нужен только с этой машины.
      - "${LISTEN_IP:-0.0.0.0}:80:80"
    volumes:
      # Long (explicit) syntax — immune to the legacy docker-compose v1
      # "too many colons" parser bug triggered by Windows drive paths.
      - type: bind
        source: ./docker/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: volume
        source: frontend_build
        target: /var/www/frontend
        read_only: true
      - type: bind
        source: ./backend/public
        target: /var/www/backend/public
        read_only: true
      # Опциональная Basic-защита /vks-bot/create: создайте файл
      # docker/nginx/htpasswd (команда — в комментарии default.conf) и
      # включите auth_basic там же. Пока файла нет — строку не раскомментируйте,
      # иначе compose упадёт с "bind source path does not exist".
      # - type: bind
      #   source: ./docker/nginx/htpasswd
      #   target: /etc/nginx/.htpasswd
      #   read_only: true
    depends_on:
      - frontend
      - backend
    networks:
      - vks-network

  # MySQL
  mysql:
    <<: *container-defaults
    image: mysql:8.0
    container_name: vks-mysql
    restart: unless-stopped
    shm_size: 64mb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-vks_2026_root}
      MYSQL_DATABASE: ${DB_DATABASE:-vks_schedule}
      MYSQL_USER: ${DB_USERNAME:-vks_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-vks_2026}
    volumes:
      # Bind-mount: данные лежат в ./docker/mysql/data и НЕ удаляются
      # при `docker compose down`, пересборке образов или удалении volumes.
      - type: bind
        source: ./docker/mysql/data
        target: /var/lib/mysql
    # Порт наружу НЕ проброшен: доступ к БД только из внутренней сети
    # vks-network (backend/queue/scheduler). Для админ-подключения при
    # необходимости временно раскомментируйте строки ниже.
    # ports:
    #   - "127.0.0.1:3306:3306"
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --key-buffer-size=8M
      - --table-definition-cache=400
      - --table-open-cache=400
      - --max-connections=80
      - --tmp-table-size=8M
      - --max-heap-table-size=16M
      - --innodb-log-buffer-size=8M
    networks:
      - vks-network

  # Redis
  redis:
    <<: *container-defaults
    image: redis:alpine
    container_name: vks-redis
    restart: unless-stopped
    # Только внутренняя сеть, лимит памяти и выгрузка старых ключей —
    # redis не съест оперативку; пароль обязателен.
    # Лимиты жёсткие: maxmemory 96mb — redis физически не сможет съесть больше;
    # allkeys-lru выгружает старые ключи; save '' отключает форк-копирование
    # при записи RDB (экономия памяти); aof только при наличии volume.
    command: >-
      redis-server --maxmemory 96mb --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-vks_2026_redis}
      --save "" --appendonly no --proto-max-bulk-len 1mb
    networks:
      - vks-network

  # Laravel Queue Worker
  queue:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
      # Общие с backend сервисы должны видеть ОДИН и тот же vendor, иначе
      # queue будет работать по коду/autoloader'у из ./backend/vendor (dev).
      - type: volume
        source: backend_vendor
        target: /var/www/html/vendor
      - type: volume
        source: backend_bootstrap_cache
        target: /var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
      DB_USERNAME: "${DB_USERNAME:-vks_user}"
      DB_PASSWORD: "${DB_PASSWORD:-vks_2026}"
      REDIS_HOST: redis
      REDIS_PASSWORD: "${REDIS_PASSWORD:-vks_2026_redis}"
      REDIS_PORT: 6379
      APP_URL: "http://${SITE_IP:-localhost}"
      APP_KEY: "${APP_KEY:-dev-placeholder-key}"
      MESSENGER: "${MESSENGER:-max}"
      MAX_ENABLED: "${MAX_ENABLED:-true}"
      MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"
    depends_on:
      - backend
      - redis
    networks:
      - vks-network

  # Laravel Scheduler
  scheduler:
    <<: *container-defaults
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vks-scheduler
    restart: unless-stopped
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      # Длинный (explicit) синтаксис — не зависит от пути с диском (D:\)
      - type: bind
        source: ./backend
        target: /var/www/html
      # Общие с backend сервисы должны видеть ОДИН и тот же vendor, иначе
      # queue будет работать по коду/autoloader'у из ./backend/vendor (dev).
      - type: volume
        source: backend_vendor
        target: /var/www/html/vendor
      - type: volume
        source: backend_bootstrap_cache
        target: /var/www/html/bootstrap/cache
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-vks_schedule}"
      DB_USERNAME: "${DB_USERNAME:-vks_user}"
      DB_PASSWORD: "${DB_PASSWORD:-vks_2026}"
      APP_URL: "http://${SITE_IP:-localhost}"
      APP_KEY: "${APP_KEY:-dev-placeholder-key}"
      MESSENGER: "${MESSENGER:-max}"
      MAX_ENABLED: "${MAX_ENABLED:-true}"
      MAX_API_URL: "${MAX_API_URL:-https://maxapi.ru/v1}"
      MAX_BOT_TOKEN: "${MAX_BOT_TOKEN:-}"
      MAX_BOT_LINK: "${MAX_BOT_LINK:-https://max.ru/id0070719725_bot}"
    depends_on:
      - backend
    networks:
      - vks-network

  # VKS-бот (Selenium): автоматически создаёт встречи на salutejazz.ru.
  # Фронт обращается к нему через nginx: /vks-bot/ -> http://vks-bot:8090/
  # ВАЖНО: сервис опциональный и НЕ запускается по умолчанию (profiles:
  # ["bot"]). Chromium внутри контейнера занимает ~0,8–1 ГБ RAM на время
  # каждого создания ссылки; без бота фронт мгновенно генерирует ссылку
  # локально в том же формате платформы — всё работает так же.
  # Включить бота: docker compose --profile bot up -d vks-bot
  # + VITE_VKS_AUTOBOT=1 при сборке фронта.
  vks-bot:
    profiles: ["bot"]
    build:
      context: ./vks-bot
      dockerfile: Dockerfile
    container_name: vks-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
    shm_size: 256mb   # иначе Chromium падает в headless из-за маленького /dev/shm
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      BOT_HEADLESS: "1"
      BOT_PORT: "8090"
      # Секрет для вызова бота (заголовок X-Bot-Token). Задайте свой в .env!
      BOT_TOKENS: "${BOT_TOKENS:-}"
    networks:
      - vks-network

networks:
  vks-network:
    driver: bridge

volumes:
  frontend_build:
  # Единый prod-vendor для backend/queue/scheduler (не пересобирается при
  # `docker compose down`, обновляется `composer install` внутри vks-backend)
  backend_vendor:
  backend_bootstrap_cache:
